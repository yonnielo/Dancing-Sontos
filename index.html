<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancing-Sontos 舞蹈班管理系統</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #22c55e;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 800px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .flex { display: flex; gap: 10px; }
    .between { justify-content: space-between; align-items: center; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-danger { background: #ef4444; }
    .btn-secondary { background: #64748b; }
    .hidden { display: none !important; }
    
    .date-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
    }
    .date-chip {
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
    }
    .date-chip.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Calendar UI */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .day-header { font-weight: bold; padding: 5px 0; }
    .day-cell {
      border: 1px solid var(--border);
      min-height: 70px;
      border-radius: 6px;
      padding: 4px;
      font-size: 12px;
      background: #fff;
    }
    .class-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 4px;
      border-radius: 4px;
      margin-top: 2px;
      font-size: 10px;
      text-align: left;
    }
    .badge-leader {
      background: #fef3c7;
      color: #b45309;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .session-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card flex between">
    <div>
      <h2 style="margin:0">💃 Dancing-Sontos</h2>
      <span id="user-status" style="font-size: 12px; color: #64748b;">未登入</span>
    </div>
    <button id="logout-btn" class="hidden" style="width: auto; margin:0;">登出</button>
  </div>

  <div id="auth-section" class="card">
    <h3 id="auth-title">會員登入</h3>
    <input type="email" id="auth-email" placeholder="電子郵件">
    <input type="password" id="auth-password" placeholder="密碼">
    
    <div id="register-extra" class="hidden">
      <input type="text" id="auth-name" placeholder="名字/暱稱 (例如: Alex)">
    </div>

    <button id="auth-main-btn">登入</button>
    <p style="text-align: center; font-size: 14px; margin: 0;">
      <a href="#" id="toggle-auth-mode">沒有帳號？點此註冊</a>
    </p>
  </div>

  <div id="app-section" class="hidden">
    
    <div class="card">
      <div class="flex between">
        <h3>➕ 我要開班 (發起課程)</h3>
        <button id="toggle-create-btn" style="width:auto; margin:0;">展開/折疊</button>
      </div>

      <div id="create-class-form" class="hidden" style="margin-top: 15px;">
        <input type="text" id="class-name" placeholder="課程名稱 (例如: Jazz Pop 基礎班)">
        
        <label style="font-size: 12px; font-weight: bold;">預設上堂地點 / Studio 名稱：</label>
        <input type="text" id="class-default-location" placeholder="例如: 旺角 ABC Studio A房">

        <label style="font-size: 12px; font-weight: bold;">點擊勾選預設上堂日期：</label>
        <div class="flex" style="margin-top: 5px;">
          <input type="date" id="single-date-picker" style="margin:0;">
          <button id="add-date-btn" type="button" style="width: 120px; margin:0;">加入日期</button>
        </div>
        
        <div id="selected-dates-container" class="date-picker-grid" style="margin-top: 10px;">
          <span style="font-size:12px; color:#94a3b8;">尚未選擇日期</span>
        </div>

        <div class="flex">
          <input type="time" id="class-time" value="19:00">
          <input type="number" id="class-price" placeholder="單堂學費 ($)">
        </div>

        <button id="add-class-btn" class="btn-success">正式發布課程</button>
      </div>
    </div>

    <div class="card">
      <div class="flex between" style="margin-bottom: 10px;">
        <h3>📅 課程月曆</h3>
        <div>
          <button id="prev-month" style="width:auto; padding: 4px 8px; margin:0;">&lt;</button>
          <span id="current-month-display" style="font-weight:bold;"></span>
          <button id="next-month" style="width:auto; padding: 4px 8px; margin:0;">&gt;</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-header">
        <div class="day-header">日</div><div class="day-header">一</div><div class="day-header">二</div>
        <div class="day-header">三</div><div class="day-header">四</div><div class="day-header">五</div><div class="day-header">六</div>
      </div>
      <div class="calendar-grid" id="calendar-days"></div>
    </div>

    <div class="card">
      <h3>📚 所有課程與獨立報名</h3>
      <div id="class-list">載入中...</div>
    </div>

  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB2ky_jGsp4Me5XNXVpvow5oUAV-ME6oG8",
    authDomain: "dancing-sontos.firebaseapp.com",
    projectId: "dancing-sontos",
    storageBucket: "dancing-sontos.firebasestorage.app",
    messagingSenderId: "522879566788",
    appId: "1:522879566788:web:e37c283d86a07d0ce79a91",
    measurementId: "G-8DPXJJGF9B"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserProfile = null;
  let isRegisterMode = false;
  let currentDate = new Date();
  let classesData = [];
  let selectedDates = [];

  const authSection = document.getElementById('auth-section');
  const appSection = document.getElementById('app-section');
  const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
  const registerExtra = document.getElementById('register-extra');
  const authMainBtn = document.getElementById('auth-main-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userStatus = document.getElementById('user-status');

  document.getElementById('toggle-create-btn').addEventListener('click', () => {
    document.getElementById('create-class-form').classList.toggle('hidden');
  });

  toggleAuthModeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').innerText = isRegisterMode ? "註冊帳號" : "會員登入";
    authMainBtn.innerText = isRegisterMode ? "註冊" : "登入";
    registerExtra.classList.toggle('hidden', !isRegisterMode);
    toggleAuthModeBtn.innerText = isRegisterMode ? "已有帳號？登入" : "沒有帳號？註冊";
  });

  authMainBtn.addEventListener('click', async () => {
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;

    if(!email || !password) return alert("請填寫完整 Email 與密碼");

    try {
      if(isRegisterMode) {
        const name = document.getElementById('auth-name').value || "舞者";
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", res.user.uid), { name, email });
        alert("註冊成功！");
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      alert("失敗: " + err.message);
    }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const userDoc = await getDoc(doc(db, "users", user.uid));
      currentUserProfile = userDoc.data() || { name: '舞者' };
      
      userStatus.innerText = `👤 ${currentUserProfile.name}`;
      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');

      loadClasses();
    } else {
      currentUser = null;
      currentUserProfile = null;
      userStatus.innerText = "未登入";
      authSection.classList.remove('hidden');
      appSection.classList.add('hidden');
      logoutBtn.classList.add('hidden');
    }
  });

  document.getElementById('add-date-btn').addEventListener('click', () => {
    const picker = document.getElementById('single-date-picker');
    const val = picker.value;
    if(!val) return alert("請先選擇日期");
    if(!selectedDates.includes(val)) {
      selectedDates.push(val);
      selectedDates.sort();
      renderSelectedDates();
    }
  });

  function renderSelectedDates() {
    const container = document.getElementById('selected-dates-container');
    if(selectedDates.length === 0) {
      container.innerHTML = `<span style="font-size:12px; color:#94a3b8;">尚未選擇日期</span>`;
      return;
    }
    container.innerHTML = selectedDates.map(d => `
      <div class="date-chip selected" onclick="removeDate('${d}')">
        ${d} ✕
      </div>
    `).join('');
  }

  window.removeDate = (d) => {
    selectedDates = selectedDates.filter(item => item !== d);
    renderSelectedDates();
  };

  // 班長發布課程 (包含獨立 sessions 結構)
  document.getElementById('add-class-btn').addEventListener('click', async () => {
    const name = document.getElementById('class-name').value;
    const defaultLocation = document.getElementById('class-default-location').value || '未定地點';
    const time = document.getElementById('class-time').value;
    const price = document.getElementById('class-price').value;

    if(!name) return alert("請輸入課程名稱");
    if(selectedDates.length === 0) return alert("請至少挑選一日上堂日期");

    // 建立獨立的 Sessions
    const sessions = {};
    selectedDates.forEach(d => {
      sessions[d] = {
        time: time,
        location: defaultLocation,
        students: [] // 該堂課的學員名單
      };
    });

    try {
      await addDoc(collection(db, "classes"), {
        name,
        sessions: sessions,
        price: Number(price) || 0,
        leaderId: currentUser.uid,
        leaderName: currentUserProfile.name,
        createdAt: new Date()
      });
      alert("開班成功！已為每堂課建立獨立報名表。");
      
      document.getElementById('class-name').value = '';
      selectedDates = [];
      renderSelectedDates();
      document.getElementById('create-class-form').classList.add('hidden');
      
      loadClasses();
    } catch(e) {
      alert("開班失敗: " + e.message);
    }
  });

  async function loadClasses() {
    const querySnapshot = await getDocs(collection(db, "classes"));
    classesData = [];
    querySnapshot.forEach((doc) => {
      classesData.push({ id: doc.id, ...doc.data() });
    });
    renderCalendar();
    renderClassList();
  }

  function renderCalendar() {
    const calendarDays = document.getElementById('calendar-days');
    calendarDays.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('current-month-display').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell';
      calendarDays.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.innerHTML = `<strong>${day}</strong>`;

      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      const dateStr = `${year}-${monthStr}-${dayStr}`;

      classesData.forEach(c => {
        if(c.sessions && c.sessions[dateStr]) {
          const sess = c.sessions[dateStr];
          const tag = document.createElement('div');
          tag.className = 'class-tag';
          tag.innerText = `${sess.time || ''} ${c.name}`;
          cell.appendChild(tag);
        }
      });

      calendarDays.appendChild(cell);
    }
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  // 渲染課程與單堂獨立報名清單
  function renderClassList() {
    const listEl = document.getElementById('class-list');
    if(classesData.length === 0) {
      listEl.innerHTML = "<p style='color:#64748b;'>目前沒有任何課程。</p>";
      return;
    }

    listEl.innerHTML = classesData.map(c => {
      const isLeader = c.leaderId === currentUser.uid;
      const sessions = c.sessions || {};
      const dateKeys = Object.keys(sessions).sort();

      const sessionsHtml = dateKeys.map(dateStr => {
        const sess = sessions[dateStr];
        const students = sess.students || [];
        const isJoined = students.some(s => s.uid === currentUser.uid);

        return `
          <div class="session-box">
            <div class="flex between">
              <div>
                <strong>📅 ${dateStr}</strong> 
                <span style="font-size:12px; color:#475569;">⏰ ${sess.time} | 📍 ${sess.location}</span>
              </div>
              <div>
                ${isJoined ? 
                  `<button onclick="toggleSessionJoin('${c.id}', '${dateStr}', false)" class="btn-danger" style="width:auto; margin:0; padding:4px 8px; font-size:12px;">取消此堂</button>` : 
                  `<button onclick="toggleSessionJoin('${c.id}', '${dateStr}', true)" class="btn-success" style="width:auto; margin:0; padding:4px 8px; font-size:12px;">報名此堂</button>`
                }
              </div>
            </div>
            <div style="font-size:11px; color:#64748b; margin-top:4px;">
              👥 出席 (${students.length}人): ${students.map(s => s.name).join(', ') || '暫無'}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="border-bottom: 2px solid var(--border); padding: 15px 0;">
          <div class="flex between">
            <div>
              <strong style="font-size: 18px;">${c.name}</strong> 
              <span class="badge-leader">👑 班長: ${c.leaderName}</span>
            </div>
            <span style="color:#6366f1; font-weight:bold;">單堂 $${c.price}</span>
          </div>

          <div style="margin-top: 10px;">
            ${sessionsHtml || '<p style="font-size:12px; color:#94a3b8;">暫無上堂日期</p>'}
          </div>

          ${isLeader ? `
            <div style="margin-top: 12px; padding: 10px; background: #fffbe0; border-radius: 8px; border: 1px solid #fde047;">
              <small style="font-weight:bold; color:#854d0e;">👑 班長管理面板：</small>
              <div class="flex" style="margin-top:6px;">
                <button onclick="addSessionToClass('${c.id}')" style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:#d97706;">➕ 加開新日期</button>
                <button onclick="editSessionDetails('${c.id}')" style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:#b45309;">✏️ 修改時間/地點/刪堂</button>
                <button onclick="deleteClass('${c.id}')" class="btn-secondary" style="width:auto; margin:0; margin-left:auto; padding:4px 8px; font-size:12px;">解散全課</button>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  // 獨立單堂報名 / 取消報名
  window.toggleSessionJoin = async (classId, dateStr, isJoining) => {
    const classObj = classesData.find(c => c.id === classId);
    if(!classObj) return;

    const sessions = classObj.sessions;
    let students = sessions[dateStr].students || [];

    if(isJoining) {
      if(!students.some(s => s.uid === currentUser.uid)) {
        students.push({ uid: currentUser.uid, name: currentUserProfile.name });
      }
    } else {
      students = students.filter(s => s.uid !== currentUser.uid);
    }

    sessions[dateStr].students = students;

    try {
      await updateDoc(doc(db, "classes", classId), { sessions: sessions });
      loadClasses();
    } catch(e) {
      alert("操作失敗: " + e.message);
    }
  };

  // 班長：新增單堂日期
  window.addSessionToClass = async (classId) => {
    const dateStr = prompt("請輸入新增日期 (格式: YYYY-MM-DD，例: 2026-08-20)：");
    if(!dateStr) return;
    const timeStr = prompt("請輸入上堂時間 (例: 20:00 - 22:00)：", "19:00");
    const locStr = prompt("請輸入上堂地點/Studio：", "旺角 Studio");

    const classObj = classesData.find(c => c.id === classId);
    const sessions = classObj.sessions || {};
    sessions[dateStr] = { time: timeStr, location: locStr, students: [] };

    await updateDoc(doc(db, "classes", classId), { sessions: sessions });
    alert("加開堂數成功！");
    loadClasses();
  };

  // 班長：修改或刪除個別堂數
  window.editSessionDetails = async (classId) => {
    const classObj = classesData.find(c => c.id === classId);
    const dates = Object.keys(classObj.sessions || {});
    if(dates.length === 0) return alert("目前沒有堂數可修改");

    const dateStr = prompt(`請輸入你想修改/刪除的日期:\n(${dates.join(', ')})`);
    if(!dateStr || !classObj.sessions[dateStr]) return alert("找不到該日期");

    const action = prompt("請選擇操作:\n1 = 修改時間與地點\n2 = 刪除此堂課", "1");
    if(action === "1") {
      const newTime = prompt("新時間:", classObj.sessions[dateStr].time);
      const newLoc = prompt("新地點/Studio:", classObj.sessions[dateStr].location);
      classObj.sessions[dateStr].time = newTime;
      classObj.sessions[dateStr].location = newLoc;
      await updateDoc(doc(db, "classes", classId), { sessions: classObj.sessions });
      alert("修改成功！");
    } else if(action === "2") {
      delete classObj.sessions[dateStr];
      await updateDoc(doc(db, "classes", classId), { sessions: classObj.sessions });
      alert("已刪除該堂課！");
    }
    loadClasses();
  };

  // 解散課程
  window.deleteClass = async (id) => {
    if(confirm("確定要全面解散此課程嗎？")) {
      await deleteDoc(doc(db, "classes", id));
      loadClasses();
    }
  }
</script>

</body>
</html>
