<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancing-Sontos 管理系統</title>
  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --bg-color: #fdf2f8;
      --card-bg: #ffffff;
      --text-main: #374151;
      --border-color: #fbcfe8;
      
      /* 按鈕與標籤顏色定義 */
      --btn-signup-bg: #86efac;      /* 淺粉綠 (報名、加開一堂、儲存變更) */
      --btn-signup-hover: #4ade80;
      --btn-cancel-bg: #ec4899;      /* 深粉紅 (取消報名，同登出掣) */
      --btn-cancel-hover: #db2777;
      --btn-manage-bg: #38bdf8;      /* 深粉藍 (管理及修改課程) */
      --btn-manage-hover: #0284c7;
      --tag-yellow-bg: #fef08a;      /* 淺奶黃 (班長 / 私人班 / 公開班) */
      --tag-yellow-text: #854d0e;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 區塊卡片 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 4px 15px rgba(244, 114, 182, 0.08);
      border: 1px solid var(--border-color);
    }

    .flex {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .between {
      justify-content: space-between;
    }

    h1, h2, h3 {
      margin: 0;
      color: #831843;
    }

    /* 通用按鈕 */
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #f3f4f6;
      color: #4b5563;
      border: 1px solid #d1d5db;
    }

    .btn-danger {
      background-color: #ef4444;
    }

    /* 需求 5: 報名按鈕 (淺粉綠) */
    .btn-signup {
      background-color: var(--btn-signup-bg) !important;
      color: #14532d !important;
    }
    .btn-signup:hover {
      background-color: var(--btn-signup-hover) !important;
    }

    /* 需求 7: 取消報名按鈕 (與登出掣同色 - 深粉紅) */
    .btn-cancel {
      background-color: var(--btn-cancel-bg) !important;
      color: white !important;
    }
    .btn-cancel:hover {
      background-color: var(--btn-cancel-hover) !important;
    }

    /* 需求 8: 管理課程按鈕 (深粉藍) */
    .btn-manage {
      background-color: var(--btn-manage-bg) !important;
      color: white !important;
    }
    .btn-manage:hover {
      background-color: var(--btn-manage-hover) !important;
    }

    .hidden {
      display: none !important;
    }

    /* 輸入框與選擇器 */
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #fbcfe8;
      border-radius: 8px;
      margin-top: 4px;
      margin-bottom: 8px;
      font-size: 13px;
      background: #fff5f8;
    }

    /* 月曆元件 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      background: #fbcfe8;
      border: 1px solid #fbcfe8;
      border-radius: 8px;
      overflow: hidden;
      margin-top: 8px;
    }

    .day-header {
      background: #fce7f3;
      text-align: center;
      padding: 6px 0;
      font-weight: bold;
      font-size: 11px;
      color: #be123c;
    }

    .day-cell {
      background: white;
      min-height: 52px;
      padding: 2px;
      font-size: 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* 需求 2: 月曆課堂標籤 (未報名淺粉紅，已報名淺粉綠) */
    .class-tag {
      background: #ffe4e6; /* 未報名: 淺粉紅 */
      color: #be123c;
      padding: 2px 4px;
      border-radius: 4px;
      font-size: 9px;
      line-height: 1.1;
      display: flex;
      flex-direction: column;
    }

    .class-tag.joined-tag {
      background: var(--btn-signup-bg); /* 已報名: 淺粉綠 */
      color: #14532d;
    }

    /* 課程卡片 */
    .course-card {
      border: 1px solid #fbcfe8;
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      background: #fff;
    }

    /* 需求 3: 班長與私人/公開班 Tag (淺奶黃色) */
    .badge-yellow {
      background-color: var(--tag-yellow-bg);
      color: var(--tag-yellow-text);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
    }

    .session-box {
      background: #fdf2f8;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      border: 1px solid #fbcfe8;
    }

    /* 需求 4: 時間文字灰色 */
    .time-text {
      color: var(--text-main);
      font-weight: bold;
    }

    .session-line {
      margin-bottom: 3px;
      font-size: 12px;
    }

    /* 管理維護區塊 (深粉藍風格) */
    .admin-edit-box {
      margin-top: 10px;
      padding: 10px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
    }

    .table-container {
      overflow-x: auto;
      margin-top: 8px;
    }

    .edit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      white-space: nowrap;
    }

    .edit-table th, .edit-table td {
      border: 1px solid #bae6fd;
      padding: 4px;
      text-align: left;
    }

    .edit-table th {
      background: #e0f2fe;
      color: #0369a1;
    }

    .student-chip {
      display: inline-flex;
      align-items: center;
      background: #e0f2fe;
      color: #0369a1;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 10px;
      margin-right: 2px;
    }

    .student-chip button {
      background: none;
      border: none;
      color: #0369a1;
      padding: 0 0 0 4px;
      cursor: pointer;
      font-size: 10px;
    }

    .user-select-list {
      max-height: 120px;
      overflow-y: auto;
      border: 1px solid #bae6fd;
      padding: 6px;
      border-radius: 6px;
      background: #fff;
    }

    .user-select-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    
    .date-chip {
      display: inline-block;
      background: #fce7f3;
      color: #be123c;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-right: 4px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
<div class="container">

  <!-- 頂部資訊區 -->
  <div class="card flex between">
    <div>
      <h2 style="font-size:18px;">👶🏻 Dancing-Sontos</h2>
      <!-- 需求 1: 頂部使用者名稱圖示改為 👶🏻 -->
      <div id="user-status" style="font-size:12px; color:#6b7280; margin-top:2px;">👶🏻 載入中...</div>
    </div>
    <div id="user-action-btns" class="hidden flex">
      <button id="delete-account-btn" class="btn-danger" style="font-size:11px; padding:4px 8px;">取消我的帳戶</button>
      <button id="logout-btn" class="btn-cancel" style="font-size:11px; padding:4px 8px;">登出</button>
    </div>
  </div>

  <!-- 登入 / 註冊區塊 -->
  <div id="auth-section" class="card">
    <h3 id="auth-title">會員登入</h3>
    <input type="email" id="auth-email" placeholder="Email 電子郵件">
    <input type="password" id="auth-password" placeholder="密碼">
    
    <div id="register-extra" class="hidden">
      <input type="text" id="auth-name" placeholder="你的名字 / 暱稱">
    </div>

    <button id="auth-main-btn" style="width:100%; margin-top:8px;">登入</button>
    <div style="text-align:center; margin-top:10px;">
      <a href="#" id="toggle-auth-mode" style="font-size:12px; color:#be123c; text-decoration:none;">沒有帳號？註冊</a>
    </div>
  </div>

  <!-- 主應用程式區塊 -->
  <div id="app-section" class="hidden flex" style="flex-direction:column; gap:12px;">

    <!-- 發起課程按鈕與表單 -->
    <div class="card">
      <div class="flex between">
        <h3>➕ 我要開班 (發起課程)</h3>
        <button id="toggle-create-btn" class="btn-secondary" style="font-size:11px; padding:4px 8px;">展開/折疊</button>
      </div>

      <div id="create-class-form" class="hidden" style="margin-top:10px;">
        <label style="font-size:12px; font-weight:bold;">課程名稱：</label>
        <input type="text" id="class-name" placeholder="例：Wilson 🚁">

        <label style="font-size:12px; font-weight:bold;">班長的話 / 備註：</label>
        <textarea id="class-leader-note" rows="2" placeholder="例：請大家自備水杯、穿著運動服～"></textarea>

        <label style="font-size:12px; font-weight:bold;">誰能報讀/查看此課程：</label>
        <select id="access-type">
          <option value="all">全部人 (公開班)</option>
          <option value="specific">指定成員 (私人小組班)</option>
        </select>

        <div id="access-user-container" class="hidden" style="margin-bottom:8px;">
          <small style="color:#6b7280;">勾選可查看與報名的成員：</small>
          <div id="all-users-checkboxes" class="user-select-list"></div>
        </div>

        <hr style="border:0; border-top:1px dashed #fbcfe8; margin:10px 0;">

        <label style="font-size:12px; font-weight:bold;">預設時間與地點：</label>
        <div class="flex" style="gap:4px;">
          <input type="time" id="class-start-time" value="19:00">
          <span style="font-size:12px;">至</span>
          <input type="time" id="class-end-time" value="21:00">
        </div>
        <input type="text" id="class-default-location" placeholder="預設地點 (例：Lck / Spk)">

        <label style="font-size:12px; font-weight:bold;">預設學費 ($/人)：</label>
        <input type="number" id="class-price" value="225">
        
        <label style="font-size:12px; font-weight:bold;">學費預設收取人 (付款人)：</label>
        <select id="class-default-fee-payer"></select>

        <label style="font-size:12px; font-weight:bold;">預設場租 ($/堂)：</label>
        <input type="number" id="class-default-rent" value="300">

        <label style="font-size:12px; font-weight:bold;">場租預設支付人：</label>
        <select id="class-default-rent-payer"></select>

        <hr style="border:0; border-top:1px dashed #fbcfe8; margin:10px 0;">

        <label style="font-size:12px; font-weight:bold;">挑選上堂日期：</label>
        <div class="flex" style="gap:4px; margin-bottom:6px;">
          <input type="date" id="single-date-picker">
          <button type="button" id="add-date-btn" class="btn-secondary" style="width:auto; white-space:nowrap; padding:6px 10px;">加入日期</button>
        </div>
        <div id="selected-dates-container" style="min-height:24px; margin-bottom:8px;"></div>

        <!-- 需求 9: 儲存/發布按鈕使用淺粉綠色 -->
        <button id="add-class-btn" class="btn-signup" style="width:100%; margin-top:8px;">🚀 發布課程</button>
      </div>
    </div>

    <!-- 課程月曆區塊 -->
    <div class="card">
      <div class="flex between" style="margin-bottom:8px;">
        <div class="flex" style="align-items:center;">
          <h3>📅 課程月曆</h3>
          <!-- 需求 2: 圖例改為 綠色: 已報名 -->
          <span style="font-size:10px; color:#be123c; margin-left:6px; font-weight:bold;">(綠色: 已報名)</span>
        </div>
        <div class="flex" style="gap:4px;">
          <button id="prev-month" class="btn-secondary" style="padding:2px 8px;">&lt;</button>
          <span id="current-month-display" style="font-weight:bold; font-size:13px; min-width:80px; text-align:center;"></span>
          <button id="next-month" class="btn-secondary" style="padding:2px 8px;">&gt;</button>
        </div>
      </div>

      <div class="calendar-grid">
        <div class="day-header">日</div>
        <div class="day-header">一</div>
        <div class="day-header">二</div>
        <div class="day-header">三</div>
        <div class="day-header">四</div>
        <div class="day-header">五</div>
        <div class="day-header">六</div>
      </div>
      <div id="calendar-days" class="calendar-grid" style="margin-top:0;"></div>
    </div>

    <!-- 課程列表區塊 -->
    <div class="card">
      <h3>所有課程</h3>
      <div id="class-list" style="margin-top:10px;"></div>
    </div>

    <!-- Admin 後台管理區塊 -->
    <div id="admin-panel" class="card hidden">
      <h3>👑 Admin 全局用戶管理</h3>
      <div class="table-container">
        <table class="edit-table">
          <thead>
            <tr>
              <th>姓名</th>
              <th>Email</th>
              <th>權限 Role</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="admin-user-tbody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB2ky_jGsp4Me5XNXVpvow5oUAV-ME6oG8",
    authDomain: "dancing-sontos.firebaseapp.com",
    projectId: "dancing-sontos",
    storageBucket: "dancing-sontos.firebasestorage.app",
    messagingSenderId: "522879566788",
    appId: "1:522879566788:web:e37c283d86a07d0ce79a91",
    measurementId: "G-8DPXJJGF9B"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserProfile = null;
  let isAdmin = false;
  let isRegisterMode = false;
  let currentDate = new Date();
  let classesData = [];
  let allUsersList = [];
  let selectedDates = [];

  document.getElementById('toggle-create-btn').addEventListener('click', () => {
    document.getElementById('create-class-form').classList.toggle('hidden');
    loadAllUsers();
  });

  document.getElementById('access-type').addEventListener('change', (e) => {
    document.getElementById('access-user-container').classList.toggle('hidden', e.target.value !== 'specific');
  });

  const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
  const registerExtra = document.getElementById('register-extra');
  const authMainBtn = document.getElementById('auth-main-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const deleteAccountBtn = document.getElementById('delete-account-btn');
  const userStatus = document.getElementById('user-status');
  const adminPanel = document.getElementById('admin-panel');

  toggleAuthModeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').innerText = isRegisterMode ? "註冊帳號" : "會員登入";
    authMainBtn.innerText = isRegisterMode ? "註冊" : "登入";
    registerExtra.classList.toggle('hidden', !isRegisterMode);
    toggleAuthModeBtn.innerText = isRegisterMode ? "已有帳號？登入" : "沒有帳號？註冊";
  });

  authMainBtn.addEventListener('click', async () => {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();

    if(!email || !password) return alert("請填寫完整資訊");

    try {
      if(isRegisterMode) {
        const name = document.getElementById('auth-name').value || "舞者";
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", res.user.uid), { name, email, role: "user" });
        alert("註冊成功！");
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      alert("登入/註冊失敗: " + err.message);
    }
  });

  logoutBtn.addEventListener('click', () => {
    signOut(auth);
  });

  deleteAccountBtn.addEventListener('click', async () => {
    if (!currentUser) return;
    
    const confirmDelete = confirm("⚠️ 警告：確定要取消並刪除您的帳戶嗎？此動作無法復原！");
    if (!confirmDelete) return;

    try {
      const userUid = currentUser.uid;
      await deleteDoc(doc(db, "users", userUid));

      try {
        await deleteUser(currentUser);
        alert("您的帳戶已成功取消並刪除。");
      } catch (authErr) {
        alert("帳戶資料已清除，已為您自動登出。");
        await signOut(auth);
      }
    } catch (err) {
      alert("取消帳戶失敗：" + err.message);
    }
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        currentUserProfile = userDoc.exists() ? userDoc.data() : { name: '舞者', role: 'user' };
      } catch(e) {
        console.error("無法取得使用者 Profile", e);
        currentUserProfile = { name: '舞者', role: 'user' };
      }
      
      isAdmin = (currentUserProfile && currentUserProfile.role === 'admin') || user.email === 'yonnielo@yahoo.com';

      // 需求 1: 頂部使用者 Icon 改為 👶🏻
      if (isAdmin) {
        userStatus.innerHTML = `<span class="badge-yellow">👑 Admin</span> ${currentUserProfile.name || '管理員'}`;
        adminPanel.classList.remove('hidden');
        loadAdminUsers();
      } else {
        userStatus.innerText = `👶🏻 ${currentUserProfile.name}`;
        adminPanel.classList.add('hidden');
      }

      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('app-section').classList.remove('hidden');
      document.getElementById('user-action-btns').classList.remove('hidden');

      loadClasses();
    } else {
      currentUser = null;
      currentUserProfile = null;
      isAdmin = false;
      userStatus.innerText = "未登入";
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('app-section').classList.add('hidden');
      adminPanel.classList.add('hidden');
      document.getElementById('user-action-btns').classList.add('hidden');
    }
  });

  async function loadAdminUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });

      const tbody = document.getElementById('admin-user-tbody');
      tbody.innerHTML = allUsersList.map(u => `
        <tr>
          <td><input type="text" value="${u.name || ''}" id="admin-name-${u.uid}"></td>
          <td><input type="text" value="${u.email || ''}" id="admin-email-${u.uid}"></td>
          <td>
            <select id="admin-role-${u.uid}" style="margin:0; padding:2px; font-size:12px;">
              <option value="user" ${u.role !== 'admin' ? 'selected' : ''}>一般用戶</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td>
            <div class="flex" style="gap:4px; margin:0;">
              <button onclick="adminSaveUser('${u.uid}')" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" class="btn-manage">儲存</button>
              <button onclick="adminResetPassword('${u.email}')" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" class="btn-cancel">重設密碼信</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch(e) {
      alert("載入用戶列表失敗: " + e.message);
    }
  }

  window.adminResetPassword = async (email) => {
    if(!email) return alert("該用戶沒有有效的 Email！");
    if(confirm(`確定要向 ${email} 發送密碼重設信嗎？`)) {
      try {
        await sendPasswordResetEmail(auth, email);
        alert(`【成功】重設密碼信已成功發送到 ${email}！請提示用戶查收 Email 並設定新密碼。`);
      } catch(e) {
        alert("【失敗】無法發送重設信: " + e.message);
      }
    }
  };

  window.adminSaveUser = async (uid) => {
    const name = document.getElementById(`admin-name-${uid}`).value.trim();
    const email = document.getElementById(`admin-email-${uid}`).value.trim();
    const role = document.getElementById(`admin-role-${uid}`).value;

    try {
      await setDoc(doc(db, "users", uid), { name, email, role }, { merge: true });
      alert("【成功】使用者資料已順利更新！");
      loadAdminUsers();
    } catch(e) {
      alert("【失敗】資料庫拒絕變更，錯誤原因: " + e.message);
    }
  };

  async function loadAllUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });

      const container = document.getElementById('all-users-checkboxes');
      container.innerHTML = allUsersList.map(u => {
        const userName = u.name || u.email || '未命名用戶';
        return `

            <input type="checkbox" value="${u.uid}" class="access-user-checkbox"> ${userName}
          </label>
        `;
      }).join('');

      const optionsHtml = allUsersList.map(u => {
        const userName = u.name || u.email || '未命名用戶';
        const isSelf = u.uid === currentUser.uid;
        return `<option value="${u.uid}" ${isSelf ? 'selected' : ''}>${userName} ${isSelf ? '(班長/預設)' : ''}</option>`;

      document.getElementById('class-default-fee-payer').innerHTML = optionsHtml;

  document.getElementById('add-date-btn').addEventListener('click', () => {
    const picker = document.getElementById('single-date-picker');
    const val = picker.value;
    if(!val) return alert("請先選擇日期");
    if(!selectedDates.includes(val)) {
      selectedDates.push(val);
      selectedDates.sort();
      renderSelectedDates();
    }
  });

  function renderSelectedDates() {
    const container = document.getElementById('selected-dates-container');
    if(selectedDates.length === 0) {
      container.innerHTML = `<span style="font-size:12px; color:#6b7280;">尚未選擇日期</span>`;
      return;
    }
    container.innerHTML = selectedDates.map(d => `
      <div class="date-chip selected" onclick="removeDate('${d}')">
        ${d} ✕
      </div>
    `).join('');
  }

  window.removeDate = (d) => {
    selectedDates = selectedDates.filter(item => item !== d);
    renderSelectedDates();
  };

  document.getElementById('add-class-btn').addEventListener('click', async () => {
    const name = document.getElementById('class-name').value.trim();
    const leaderNote = document.getElementById('class-leader-note').value.trim();
    const defaultLocation = document.getElementById('class-default-location').value || '未定地點';
    
    const startTime = document.getElementById('class-start-time').value || '19:00';
    const endTime = document.getElementById('class-end-time').value || '21:00';

    const defaultFee = Number(document.getElementById('class-price').value) || 0;
    const defaultFeePayerUid = document.getElementById('class-default-fee-payer').value || currentUser.uid;
    const feePayerObj = allUsersList.find(u => u.uid === defaultFeePayerUid);
    const defaultFeePayerName = feePayerObj ? (feePayerObj.name || feePayerObj.email) : (currentUserProfile.name || '班長');

    const defaultRent = Number(document.getElementById('class-default-rent').value) || 0;
    const defaultRentPayerUid = document.getElementById('class-default-rent-payer').value || currentUser.uid;
    const rentPayerObj = allUsersList.find(u => u.uid === defaultRentPayerUid);
    const defaultRentPayerName = rentPayerObj ? (rentPayerObj.name || rentPayerObj.email) : (currentUserProfile.name || '班長');

    const accessType = document.getElementById('access-type').value;
    let allowedUsers = [];

    if(accessType === 'specific') {
      const checkboxes = document.querySelectorAll('.access-user-checkbox:checked');
      allowedUsers = Array.from(checkboxes).map(cb => cb.value);
      if(!allowedUsers.includes(currentUser.uid)) allowedUsers.push(currentUser.uid);
    }

    if(!name) return alert("請輸入課程名稱");
    if(selectedDates.length === 0) return alert("請至少挑選一日上堂日期");

    const sessions = {};
    selectedDates.forEach(d => {
      sessions[d] = { 
        startTime, 
        endTime, 
        location: defaultLocation, 
        fee: defaultFee,
        feePayerUid: defaultFeePayerUid,
        feePayerName: defaultFeePayerName,
        rent: defaultRent,
        rentPayerUid: defaultRentPayerUid,
        rentPayerName: defaultRentPayerName,
        isClosed: false,
        students: [] 
      };
    });

    try {
      await addDoc(collection(db, "classes"), {
        name,
        leaderNote,
        sessions,
        price: defaultFee,
        leaderId: currentUser.uid,
        leaderName: currentUserProfile.name || '班長',
        accessType,
        allowedUsers,
        createdAt: new Date()
      });
      alert("發布課程成功！");
      
      document.getElementById('class-name').value = '';
      document.getElementById('class-leader-note').value = '';
      selectedDates = [];
      renderSelectedDates();
      document.getElementById('create-class-form').classList.add('hidden');
      
      loadClasses();
    } catch(e) {
      alert("發布失敗: " + e.message);
    }
  });

  async function loadClasses() {
    try {
      const querySnapshot = await getDocs(collection(db, "classes"));
      classesData = [];
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if(!isAdmin && data.accessType === 'specific' && (!data.allowedUsers || !data.allowedUsers.includes(currentUser.uid))) {
          return;
        }
        classesData.push({ id: docSnap.id, ...data });
      });
      renderCalendar();
      renderClassList();
    } catch(e) {
      console.error("載入課程失敗:", e);
    }
  }

  function renderCalendar() {
    const calendarDays = document.getElementById('calendar-days');
    calendarDays.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('current-month-display').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell';
      emptyCell.style.background = '#f9fafb';
      calendarDays.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.innerHTML = `<strong>${day}</strong>`;

      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      const dateStr = `${year}-${monthStr}-${dayStr}`;

      classesData.forEach(c => {
        if(c.sessions && c.sessions[dateStr]) {
          const sess = c.sessions[dateStr];
          const isJoined = (sess.students || []).some(s => s.uid === currentUser.uid);
          const showTime = sess.startTime || sess.time || '';

          const tag = document.createElement('div');
          // 需求 2: 未報名用淺粉紅，已報名用 joined-tag (淺粉綠)
          tag.className = `class-tag ${isJoined ? 'joined-tag' : ''}`;
          
          tag.innerHTML = `
            <span class="tag-time">${showTime}</span>
            <span class="tag-name">${c.name}</span>
          `;
          cell.appendChild(tag);
        }
      });

      calendarDays.appendChild(cell);
    }
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

    document.getElementById(`edit-access-user-container-${classId}`).classList.toggle('hidden', val !== 'specific');
  };

  window.toggleTableEdit = async (classId) => {
    const container = document.getElementById(`table-editor-${classId}`);
    container.classList.toggle('hidden');
    if(!container.classList.contains('hidden')) {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });

      await renderEditUsersList(classId);
      renderTableRows(classId);
    }
  };

    const allowed = classObj.allowedUsers || [];

    container.innerHTML = allUsersList.map(u => {

          <input type="checkbox" value="${u.uid}" class="edit-user-cb-${classId}" ${isChecked ? 'checked' : ''}> ${userName}
        </label>
      `;

  }

  window.addStudentToSessionRow = (btn) => {
    const tr = btn.closest('tr');
    const select = tr.querySelector('.add-student-select');
    const selectedUid = select.value;
    const userObj = allUsersList.find(u => u.uid === selectedUid);
    if (!userObj) return;

    const container = tr.querySelector('.students-container');
    if (container.querySelector(`[data-uid="${selectedUid}"]`)) return alert("該學員已在名單中");

    const chip = document.createElement('span');
    chip.className = 'student-chip';
    chip.setAttribute('data-uid', selectedUid);
    chip.setAttribute('data-name', userObj.name || userObj.email);
    chip.innerHTML = `${userObj.name || userObj.email} <button type="button" onclick="removeStudentFromSessionRow(this)">✕</button>`;
    container.appendChild(chip);
  };

  window.removeStudentFromSessionRow = (btn) => {
    btn.closest('.student-chip').remove();
  };

    const classObj = classesData.find(c => c.id === classId);

    const addStudentOptions = allUsersList.map(u => `<option value="${u.uid}">${u.name || u.email}</option>`).join('');
    const payerOptions = allUsersList.map(u => {
      const isSelected = u.uid === classObj.leaderId;
      return `<option value="${u.uid}" ${isSelected ? 'selected' : ''}>${u.name || u.email}</option>`;
    }).join('');

    const tr = document.createElement('tr');
    tr.className = 'edit-session-row';
    tr.innerHTML = `
      <td><input type="date" value="${todayStr}" class="edit-date-input"></td>
      <td>
        <select class="edit-closed-select" style="font-weight:bold; color: #6b7280;">
          <option value="false" selected>OFF</option>
          <option value="true">ON (封盤)</option>
        </select>
      </td>
      <td><input type="time" value="19:00" class="edit-start-time-input"></td>
      <td><input type="time" value="21:00" class="edit-end-time-input"></td>
      <td><input type="text" value="Studio A" class="edit-loc-input"></td>
      <td><input type="number" value="${classObj.price || 0}" class="edit-fee-input"></td>
      <td>
        <select class="edit-fee-payer-select">
          ${payerOptions}
        </select>
      </td>
      <td><input type="number" value="0" class="edit-rent-input"></td>
      <td>
        <select class="edit-rent-payer-select">
          ${payerOptions}
        </select>
      </td>
      <td>
        <div class="students-container" style="display:flex; flex-wrap:wrap; gap:3px; margin-bottom:4px;"></div>
        <div style="display:flex; gap:4px; align-items:center;">
          <select class="add-student-select" style="margin:0; padding:2px 4px; font-size:11px; flex:1;">
            ${addStudentOptions}
          </select>
          <button type="button" onclick="addStudentToSessionRow(this)" style="width:auto; margin:0; padding:2px 6px; font-size:11px; background:#38bdf8; white-space:nowrap; border-radius:4px; color:#fff;">加人</button>
        </div>
      </td>
      <td><button onclick="this.closest('tr').remove()" style="padding:3px 6px; margin:0; background:#fb7185; font-size:11px; white-space:nowrap; color:#fff;">刪除</button></td>
    `;
    tbody.appendChild(tr);
  };

  window.saveTableChanges = async (classId) => {
    const classObj = classesData.find(c => c.id === classId);
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const rows = tbody.querySelectorAll('.edit-session-row');

    const newClassName = document.getElementById(`edit-class-name-${classId}`).value.trim();
    const newLeaderNote = document.getElementById(`edit-leader-note-${classId}`).value.trim();
    
    if(!newClassName) return alert("課程名稱不能為空！");

    const accessType = document.getElementById(`edit-access-type-${classId}`).value;
    let allowedUsers = [];

    if(accessType === 'specific') {
      const cbs = document.querySelectorAll(`.edit-user-cb-${classId}:checked`);
      allowedUsers = Array.from(cbs).map(cb => cb.value);
      if(!allowedUsers.includes(classObj.leaderId)) allowedUsers.push(classObj.leaderId);
    }

    const newSessions = {};
    rows.forEach(tr => {
      const dateVal = tr.querySelector('.edit-date-input').value;
      const isClosed = tr.querySelector('.edit-closed-select').value === 'true';
      const startTimeVal = tr.querySelector('.edit-start-time-input').value;
      const endTimeVal = tr.querySelector('.edit-end-time-input').value;
      const locVal = tr.querySelector('.edit-loc-input').value;

      const feeVal = Number(tr.querySelector('.edit-fee-input').value) || 0;
      const feePayerUid = tr.querySelector('.edit-fee-payer-select').value;
      const feePayerObj = allUsersList.find(u => u.uid === feePayerUid);
      const feePayerName = feePayerObj ? (feePayerObj.name || feePayerObj.email) : '班長';

      const rentVal = Number(tr.querySelector('.edit-rent-input').value) || 0;
      const rentPayerUid = tr.querySelector('.edit-rent-payer-select').value;
      const rentPayerObj = allUsersList.find(u => u.uid === rentPayerUid);
      const rentPayerName = rentPayerObj ? (rentPayerObj.name || rentPayerObj.email) : '班長';

      const studentChips = tr.querySelectorAll('.student-chip');
      const updatedStudents = [];
      studentChips.forEach(chip => {
        const uid = chip.getAttribute('data-uid');
        const nameText = chip.getAttribute('data-name') || chip.innerText.replace('✕', '').trim();
        if (uid) {
          updatedStudents.push({ uid, name: nameText });
        }
      });

      if(dateVal) {
        newSessions[dateVal] = {
          startTime: startTimeVal,
          endTime: endTimeVal,
          location: locVal,
          fee: feeVal,
          feePayerUid,
          feePayerName,
          rent: rentVal,
          rentPayerUid,
          rentPayerName,
          isClosed,
          students: updatedStudents
        };
      }
    });

    try {
      await updateDoc(doc(db, "classes", classId), {
        name: newClassName,
        leaderNote: newLeaderNote,
        accessType,
        allowedUsers,
        sessions: newSessions
      });
      alert("【成功】課程資訊與堂數封盤狀態已順利更新！");
      loadClasses();
    } catch(e) {
      alert("儲存失敗: " + e.message);
    }
  };

  window.toggleSessionJoin = async (classId, dateStr, isJoining) => {
    const classObj = classesData.find(c => c.id === classId);
    if(!classObj) return;

    const sessions = classObj.sessions;
    if (sessions[dateStr].isClosed) {
      return alert("該堂課已封盤，無法進行報名或取消報名！");
    }

    let students = sessions[dateStr].students || [];

    if(isJoining) {
      if(!students.some(s => s.uid === currentUser.uid)) {
        students.push({ uid: currentUser.uid, name: currentUserProfile.name || '學員' });
      }
    } else {
      students = students.filter(s => s.uid !== currentUser.uid);
    }

    sessions[dateStr].students = students;

    try {
      await updateDoc(doc(db, "classes", classId), { sessions: sessions });
      loadClasses();
    } catch(e) {
      alert("操作失敗: " + e.message);
    }
  };

  window.deleteClass = async (id) => {
    if(confirm("確定要刪除/解散此課程嗎？")) {
      try {
        await deleteDoc(doc(db, "classes", id));
        alert("課程已成功從資料庫刪除！");
        loadClasses();
      } catch(e) {
        alert("刪除失敗: " + e.message);
      }
    }
  }
</script>

</body>
</html>
