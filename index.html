<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dancing-Sontos 舞蹈班管理系統</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --success: #22c55e;
      --joined-bg: #dcfce7;
      --joined-border: #86efac;
      --admin-bg: #fef2f2;
      --admin-border: #fca5a5;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
    }
    .container { max-width: 850px; margin: 0 auto; }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .card-admin {
      background: var(--admin-bg);
      border: 1px solid var(--admin-border);
    }
    .flex { display: flex; gap: 10px; }
    .between { justify-content: space-between; align-items: center; }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: var(--primary-hover); }
    .btn-success { background: var(--success); }
    .btn-danger { background: #ef4444; }
    .btn-secondary { background: #64748b; }
    .btn-admin { background: #dc2626; }
    .btn-warning { background: #f59e0b; color: white; }
    .hidden { display: none !important; }
    
    .date-picker-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
    }
    .date-chip {
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 6px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
    }
    .date-chip.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* Calendar UI */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .day-header { font-weight: bold; padding: 5px 0; }
    .day-cell {
      border: 1px solid var(--border);
      min-height: 70px;
      border-radius: 6px;
      padding: 4px;
      font-size: 12px;
      background: #fff;
      transition: background-color 0.2s;
    }
    .day-cell.joined-day {
      background-color: var(--joined-bg) !important;
      border: 1px solid var(--joined-border) !important;
    }
    .class-tag {
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 4px;
      border-radius: 4px;
      margin-top: 2px;
      font-size: 10px;
      text-align: left;
    }
    .badge-leader {
      background: #fef3c7;
      color: #b45309;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .badge-admin {
      background: #fecdd3;
      color: #9f1239;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .session-box {
      background: #f1f5f9;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-top: 8px;
    }

    /* 管理表格 */
    .edit-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .edit-table th, .edit-table td {
      border: 1px solid var(--border);
      padding: 6px;
      text-align: left;
    }
    .edit-table input {
      margin: 0;
      padding: 4px;
      font-size: 12px;
    }
    .user-select-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      max-height: 120px;
      overflow-y: auto;
      background: #fff;
    }
    .user-select-item {
      font-size: 12px;
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card flex between">
    <div>
      <h2 style="margin:0">💃 Dancing-Sontos</h2>
      <span id="user-status" style="font-size: 12px; color: #64748b;">未登入</span>
    </div>
    <button id="logout-btn" class="hidden" style="width: auto; margin:0;">登出</button>
  </div>

  <div id="auth-section" class="card">
    <h3 id="auth-title">會員登入</h3>
    <input type="text" id="auth-email" placeholder="電子郵件">
    <input type="password" id="auth-password" placeholder="密碼">
    
    <div id="register-extra" class="hidden">
      <input type="text" id="auth-name" placeholder="名字/暱稱 (例如: Alex)">
    </div>

    <button id="auth-main-btn">登入</button>
    <div style="display:flex; justify-content:space-between; margin-top: 10px;">
      <a href="#" id="toggle-auth-mode" style="font-size:13px;">沒有帳號？點此註冊</a>
    </div>
  </div>

  <div id="app-section" class="hidden">
    
    <div id="admin-panel" class="card card-admin hidden">
      <h3 style="color:#9f1239; margin-top:0;">👑 Admin 全系統最高管理面板</h3>
      
      <div style="margin-bottom: 20px;">
        <h4 style="margin-bottom:5px;">👥 全站用戶列表與管理</h4>
        <div style="background:#fff; padding:10px; border-radius:8px; border:1px solid var(--border);">
          <div class="flex" style="gap:5px;">
            <input type="text" id="admin-new-name" placeholder="新增暱稱" style="margin:0;">
            <input type="text" id="admin-new-email" placeholder="新增 Email/帳號" style="margin:0;">
            <button id="admin-add-user-btn" class="btn-success" style="width:140px; margin:0; font-size:12px;">➕ 手動新增用戶</button>
          </div>
          <table class="edit-table" style="margin-top:10px;">
            <thead>
              <tr>
                <th>暱稱</th>
                <th>Email / 帳號</th>
                <th>角色 (Role)</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="admin-user-tbody">
              </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="flex between">
        <h3>➕ 我要開班 (發起課程)</h3>
        <button id="toggle-create-btn" style="width:auto; margin:0;">展開/折疊</button>
      </div>

      <div id="create-class-form" class="hidden" style="margin-top: 15px;">
        <input type="text" id="class-name" placeholder="課程名稱 (例如: Jazz Pop 基礎班)">
        
        <label style="font-size: 12px; font-weight: bold;">預設上堂地點 / Studio 名稱：</label>
        <input type="text" id="class-default-location" placeholder="例如: 旺角 ABC Studio A房">

        <label style="font-size: 12px; font-weight: bold;">點擊勾選預設上堂日期：</label>
        <div class="flex" style="margin-top: 5px;">
          <input type="date" id="single-date-picker" style="margin:0;">
          <button id="add-date-btn" type="button" style="width: 120px; margin:0;">加入日期</button>
        </div>
        
        <div id="selected-dates-container" class="date-picker-grid" style="margin-top: 10px;">
          <span style="font-size:12px; color:#94a3b8;">尚未選擇日期</span>
        </div>

        <div class="flex">
          <input type="time" id="class-time" value="19:00">
          <input type="number" id="class-price" placeholder="單堂學費 ($)">
        </div>

        <label style="font-size: 12px; font-weight: bold;">誰能報讀 / 查看此課程：</label>
        <select id="access-type">
          <option value="all">全部人 (公開班)</option>
          <option value="specific">指定成員 (私人小組班)</option>
        </select>

        <div id="access-user-container" class="hidden" style="margin-bottom: 12px;">
          <small style="color:#64748b;">勾選可以查看與報名的成員：</small>
          <div id="all-users-checkboxes" class="user-select-list">
            </div>
        </div>

        <button id="add-class-btn" class="btn-success">正式發布課程</button>
      </div>
    </div>

    <div class="card">
      <div class="flex between" style="margin-bottom: 10px;">
        <h3>📅 課程月曆 <small style="font-size:11px; font-weight:normal; color:#166534;">(🟩 綠底表示已報名堂數)</small></h3>
        <div>
          <button id="prev-month" style="width:auto; padding: 4px 8px; margin:0;">&lt;</button>
          <span id="current-month-display" style="font-weight:bold;"></span>
          <button id="next-month" style="width:auto; padding: 4px 8px; margin:0;">&gt;</button>
        </div>
      </div>
      <div class="calendar-grid" id="calendar-header">
        <div class="day-header">日</div><div class="day-header">一</div><div class="day-header">二</div>
        <div class="day-header">三</div><div class="day-header">四</div><div class="day-header">五</div><div class="day-header">六</div>
      </div>
      <div class="calendar-grid" id="calendar-days"></div>
    </div>

    <div class="card">
      <h3>📚 所有課程與獨立報名</h3>
      <div id="class-list">載入中...</div>
    </div>

  </div>

</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB2ky_jGsp4Me5XNXVpvow5oUAV-ME6oG8",
    authDomain: "dancing-sontos.firebaseapp.com",
    projectId: "dancing-sontos",
    storageBucket: "dancing-sontos.firebasestorage.app",
    messagingSenderId: "522879566788",
    appId: "1:522879566788:web:e37c283d86a07d0ce79a91",
    measurementId: "G-8DPXJJGF9B"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserProfile = null;
  let isAdmin = false;
  let isRegisterMode = false;
  let currentDate = new Date();
  let classesData = [];
  let allUsersList = [];
  let selectedDates = [];

  const authSection = document.getElementById('auth-section');
  const appSection = document.getElementById('app-section');
  const toggleAuthModeBtn = document.getElementById('toggle-auth-mode');
  const registerExtra = document.getElementById('register-extra');
  const authMainBtn = document.getElementById('auth-main-btn');
  const logoutBtn = document.getElementById('logout-btn');
  const userStatus = document.getElementById('user-status');
  const adminPanel = document.getElementById('admin-panel');

  document.getElementById('toggle-create-btn').addEventListener('click', () => {
    document.getElementById('create-class-form').classList.toggle('hidden');
    loadAllUsers();
  });

  document.getElementById('access-type').addEventListener('change', (e) => {
    document.getElementById('access-user-container').classList.toggle('hidden', e.target.value !== 'specific');
  });

  toggleAuthModeBtn.addEventListener('click', (e) => {
    e.preventDefault();
    isRegisterMode = !isRegisterMode;
    document.getElementById('auth-title').innerText = isRegisterMode ? "註冊帳號" : "會員登入";
    authMainBtn.innerText = isRegisterMode ? "註冊" : "登入";
    registerExtra.classList.toggle('hidden', !isRegisterMode);
    toggleAuthModeBtn.innerText = isRegisterMode ? "已有帳號？登入" : "沒有帳號？註冊";
  });

  authMainBtn.addEventListener('click', async () => {
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value.trim();

    if(!email || !password) return alert("請填寫完整資訊");

    try {
      if(isRegisterMode) {
        const name = document.getElementById('auth-name').value || "舞者";
        const res = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", res.user.uid), { name, email, role: "user" });
        alert("註冊成功！");
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
    } catch (err) {
      alert("登入/註冊失敗: " + err.message);
    }
  });

  logoutBtn.addEventListener('click', () => {
    signOut(auth);
  });

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      try {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        currentUserProfile = userDoc.exists() ? userDoc.data() : { name: '舞者', role: 'user' };
      } catch(e) {
        console.error("無法取得使用者 Profile", e);
        currentUserProfile = { name: '舞者', role: 'user' };
      }
      
      isAdmin = (currentUserProfile && currentUserProfile.role === 'admin') || user.email === 'yonnielo@yahoo.com';

      if (isAdmin) {
        userStatus.innerHTML = `<span class="badge-admin">👑 Admin</span> ${currentUserProfile.name || '管理員'}`;
        adminPanel.classList.remove('hidden');
        loadAdminUsers();
      } else {
        userStatus.innerText = `👤 ${currentUserProfile.name}`;
        adminPanel.classList.add('hidden');
      }

      authSection.classList.add('hidden');
      appSection.classList.remove('hidden');
      logoutBtn.classList.remove('hidden');

      loadClasses();
    } else {
      currentUser = null;
      currentUserProfile = null;
      isAdmin = false;
      userStatus.innerText = "未登入";
      authSection.classList.remove('hidden');
      appSection.classList.add('hidden');
      adminPanel.classList.add('hidden');
      logoutBtn.classList.add('hidden');
    }
  });

  // ---------------- ADMIN 功能 ----------------

  async function loadAdminUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });

      const tbody = document.getElementById('admin-user-tbody');
      tbody.innerHTML = allUsersList.map(u => `
        <tr>
          <td><input type="text" value="${u.name || ''}" id="admin-name-${u.uid}"></td>
          <td><input type="text" value="${u.email || ''}" id="admin-email-${u.uid}"></td>
          <td>
            <select id="admin-role-${u.uid}" style="margin:0; padding:2px; font-size:12px;">
              <option value="user" ${u.role !== 'admin' ? 'selected' : ''}>一般用戶</option>
              <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
            </select>
          </td>
          <td>
            <div class="flex" style="gap:4px; margin:0;">
              <button onclick="adminSaveUser('${u.uid}')" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" class="btn-success">儲存</button>
              <button onclick="adminResetPassword('${u.email}')" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" class="btn-warning">重設密碼信</button>
              <button onclick="adminDeleteUser('${u.uid}')" style="width:auto; margin:0; padding:2px 6px; font-size:10px;" class="btn-danger">刪除</button>
            </div>
          </td>
        </tr>
      `).join('');
    } catch(e) {
      alert("載入用戶列表失敗: " + e.message);
    }
  }

  // 重設密碼郵件發送功能
  window.adminResetPassword = async (email) => {
    if(!email) return alert("該用戶沒有有效的 Email！");
    if(confirm(`確定要向 ${email} 發送密碼重設信嗎？`)) {
      try {
        await sendPasswordResetEmail(auth, email);
        alert(`【成功】重設密碼信已成功發送到 ${email}！請提示用戶查收 Email 並設定新密碼。`);
      } catch(e) {
        alert("【失敗】無法發送重設信: " + e.message);
      }
    }
  };

  document.getElementById('admin-add-user-btn').addEventListener('click', async () => {
    const name = document.getElementById('admin-new-name').value.trim();
    const email = document.getElementById('admin-new-email').value.trim();

    if(!name || !email) return alert("請輸入暱稱與 Email");

    try {
      const customUid = "user_" + Date.now();
      await setDoc(doc(db, "users", customUid), { name, email, role: "user" });
      alert("新增用戶成功！");
      document.getElementById('admin-new-name').value = '';
      document.getElementById('admin-new-email').value = '';
      loadAdminUsers();
    } catch(e) {
      alert("新增失敗: " + e.message);
    }
  });

  window.adminSaveUser = async (uid) => {
    const name = document.getElementById(`admin-name-${uid}`).value.trim();
    const email = document.getElementById(`admin-email-${uid}`).value.trim();
    const role = document.getElementById(`admin-role-${uid}`).value;

    try {
      await setDoc(doc(db, "users", uid), { name, email, role }, { merge: true });
      alert("【成功】使用者資料已順利更新！");
      loadAdminUsers();
    } catch(e) {
      alert("【失敗】資料庫拒絕變更，錯誤原因: " + e.message);
    }
  };

  window.adminDeleteUser = async (uid) => {
    if(confirm("確定要從資料庫刪除此用戶嗎？")) {
      try {
        await deleteDoc(doc(db, "users", uid));
        alert("【成功】使用者已成功從資料庫移除！");
        loadAdminUsers();
      } catch(e) {
        alert("【失敗】刪除失敗: " + e.message);
      }
    }
  };
  // ---------------- 共通/課堂功能 ----------------

  async function loadAllUsers() {
    try {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });

      const container = document.getElementById('all-users-checkboxes');
      container.innerHTML = allUsersList.map(u => `
        <label class="user-select-item">
          <input type="checkbox" value="${u.uid}" class="access-user-checkbox"> ${u.name}
        </label>
      `).join('');
    } catch(e) {
      console.error(e);
    }
  }

  document.getElementById('add-date-btn').addEventListener('click', () => {
    const picker = document.getElementById('single-date-picker');
    const val = picker.value;
    if(!val) return alert("請先選擇日期");
    if(!selectedDates.includes(val)) {
      selectedDates.push(val);
      selectedDates.sort();
      renderSelectedDates();
    }
  });

  function renderSelectedDates() {
    const container = document.getElementById('selected-dates-container');
    if(selectedDates.length === 0) {
      container.innerHTML = `<span style="font-size:12px; color:#94a3b8;">尚未選擇日期</span>`;
      return;
    }
    container.innerHTML = selectedDates.map(d => `
      <div class="date-chip selected" onclick="removeDate('${d}')">
        ${d} ✕
      </div>
    `).join('');
  }

  window.removeDate = (d) => {
    selectedDates = selectedDates.filter(item => item !== d);
    renderSelectedDates();
  };

  document.getElementById('add-class-btn').addEventListener('click', async () => {
    const name = document.getElementById('class-name').value;
    const defaultLocation = document.getElementById('class-default-location').value || '未定地點';
    const time = document.getElementById('class-time').value;
    const price = document.getElementById('class-price').value;

    const accessType = document.getElementById('access-type').value;
    let allowedUsers = [];

    if(accessType === 'specific') {
      const checkboxes = document.querySelectorAll('.access-user-checkbox:checked');
      allowedUsers = Array.from(checkboxes).map(cb => cb.value);
      if(!allowedUsers.includes(currentUser.uid)) allowedUsers.push(currentUser.uid);
    }

    if(!name) return alert("請輸入課程名稱");
    if(selectedDates.length === 0) return alert("請至少挑選一日上堂日期");

    const sessions = {};
    selectedDates.forEach(d => {
      sessions[d] = { time, location: defaultLocation, students: [] };
    });

    try {
      await addDoc(collection(db, "classes"), {
        name,
        sessions,
        price: Number(price) || 0,
        leaderId: currentUser.uid,
        leaderName: currentUserProfile.name || '班長',
        accessType,
        allowedUsers,
        createdAt: new Date()
      });
      alert("發布課程成功！");
      
      document.getElementById('class-name').value = '';
      selectedDates = [];
      renderSelectedDates();
      document.getElementById('create-class-form').classList.add('hidden');
      
      loadClasses();
    } catch(e) {
      alert("發布失敗: " + e.message);
    }
  });

  async function loadClasses() {
    try {
      const querySnapshot = await getDocs(collection(db, "classes"));
      classesData = [];
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if(!isAdmin && data.accessType === 'specific' && (!data.allowedUsers || !data.allowedUsers.includes(currentUser.uid))) {
          return;
        }
        classesData.push({ id: docSnap.id, ...data });
      });
      renderCalendar();
      renderClassList();
    } catch(e) {
      console.error("載入課程失敗:", e);
    }
  }

  function renderCalendar() {
    const calendarDays = document.getElementById('calendar-days');
    calendarDays.innerHTML = '';

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById('current-month-display').innerText = `${year}年 ${month + 1}月`;

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
      const emptyCell = document.createElement('div');
      emptyCell.className = 'day-cell';
      calendarDays.appendChild(emptyCell);
    }

    for (let day = 1; day <= daysInMonth; day++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';
      cell.innerHTML = `<strong>${day}</strong>`;

      const monthStr = String(month + 1).padStart(2, '0');
      const dayStr = String(day).padStart(2, '0');
      const dateStr = `${year}-${monthStr}-${dayStr}`;

      let userJoinedThisDay = false;

      classesData.forEach(c => {
        if(c.sessions && c.sessions[dateStr]) {
          const sess = c.sessions[dateStr];
          const tag = document.createElement('div');
          tag.className = 'class-tag';
          tag.innerText = `${sess.time || ''} ${c.name}`;
          cell.appendChild(tag);

          if((sess.students || []).some(s => s.uid === currentUser.uid)) {
            userJoinedThisDay = true;
          }
        }
      });

      if(userJoinedThisDay) {
        cell.classList.add('joined-day');
      }

      calendarDays.appendChild(cell);
    }
  }

  document.getElementById('prev-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById('next-month').addEventListener('click', () => {
    currentDate.setMonth(currentDate.getMonth() + 1);
    renderCalendar();
  });

  function renderClassList() {
    const listEl = document.getElementById('class-list');
    if(classesData.length === 0) {
      listEl.innerHTML = "<p style='color:#64748b;'>目前沒有課程。</p>";
      return;
    }

    listEl.innerHTML = classesData.map(c => {
      const isLeader = c.leaderId === currentUser.uid;
      const canManage = isLeader || isAdmin;
      const sessions = c.sessions || {};
      const dateKeys = Object.keys(sessions).sort();

      const sessionsHtml = dateKeys.map(dateStr => {
        const sess = sessions[dateStr];
        const students = sess.students || [];
        const isJoined = students.some(s => s.uid === currentUser.uid);

        return `
          <div class="session-box">
            <div class="flex between">
              <div>
                <strong>📅 ${dateStr}</strong> 
                <span style="font-size:12px; color:#475569;">⏰ ${sess.time} | 📍 ${sess.location}</span>
              </div>
              <div>
                ${isJoined ? 
                  `<button onclick="toggleSessionJoin('${c.id}', '${dateStr}', false)" class="btn-danger" style="width:auto; margin:0; padding:4px 8px; font-size:12px;">取消此堂</button>` : 
                  `<button onclick="toggleSessionJoin('${c.id}', '${dateStr}', true)" class="btn-success" style="width:auto; margin:0; padding:4px 8px; font-size:12px;">報名此堂</button>`
                }
              </div>
            </div>
            <div style="font-size:11px; color:#64748b; margin-top:4px;">
              👥 出席 (${students.length}人): ${students.map(s => s.name).join(', ') || '暫無'}
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="border-bottom: 2px solid var(--border); padding: 15px 0;">
          <div class="flex between">
            <div>
              <strong style="font-size: 18px;">${c.name}</strong> 
              <span class="badge-leader">👑 班長: ${c.leaderName}</span>
              ${c.accessType === 'specific' ? `<span style="font-size:10px; background:#f3e8ff; color:#6b21a8; padding:2px 4px; border-radius:4px;">🔒 私人班</span>` : ''}
            </div>
            <span style="color:#6366f1; font-weight:bold;">單堂 $${c.price}</span>
          </div>

          <div style="margin-top: 10px;">
            ${sessionsHtml || '<p style="font-size:12px; color:#94a3b8;">暫無上堂日期</p>'}
          </div>

          ${canManage ? `
            <div style="margin-top: 12px; padding: 10px; background: #fffbe0; border-radius: 8px; border: 1px solid #fde047;">
              <div class="flex between">
                <small style="font-weight:bold; color:#854d0e;">🛠️ ${isAdmin ? 'Admin' : '班長'} 管理功能：</small>
                <button onclick="toggleTableEdit('${c.id}')" style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:#d97706;">✏️ 管理堂數與成員權限</button>
              </div>

              <div id="table-editor-${c.id}" class="hidden" style="margin-top: 10px;">
                
                <div style="background:#fff; padding:10px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:10px;">
                  <label style="font-size:12px; font-weight:bold;">🔒 修改「誰能報讀/查看」此課程：</label>
                  <select id="edit-access-type-${c.id}" onchange="toggleEditAccessUserList('${c.id}')" style="margin-top:4px;">
                    <option value="all" ${c.accessType !== 'specific' ? 'selected' : ''}>全部人 (公開班)</option>
                    <option value="specific" ${c.accessType === 'specific' ? 'selected' : ''}>指定成員 (私人小組班)</option>
                  </select>

                  <div id="edit-access-user-container-${c.id}" class="${c.accessType === 'specific' ? '' : 'hidden'}" style="margin-top:6px;">
                    <small style="color:#64748b;">勾選可查看與報名的成員：</small>
                    <div id="edit-users-list-${c.id}" class="user-select-list" style="margin-top:4px;">
                      </div>
                  </div>
                </div>

                <label style="font-size:12px; font-weight:bold;">📅 編輯堂數地點：</label>
                <table class="edit-table">
                  <thead>
                    <tr>
                      <th>日期 (YYYY-MM-DD)</th>
                      <th>時間</th>
                      <th>地點</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="table-tbody-${c.id}">
                  </tbody>
                </table>
                <div class="flex" style="margin-top: 8px;">
                  <button onclick="addTableRow('${c.id}')" style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:#10b981;">➕ 加開一堂</button>
                  <button onclick="saveTableChanges('${c.id}')" style="width:auto; margin:0; padding:4px 8px; font-size:12px; background:#2563eb;">💾 儲存所有變更</button>
                  <button onclick="deleteClass('${c.id}')" class="btn-danger" style="width:auto; margin:0; margin-left:auto; padding:4px 8px; font-size:12px;">刪除全課</button>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }).join('');
  }

  window.toggleEditAccessUserList = (classId) => {
    const val = document.getElementById(`edit-access-type-${classId}`).value;
    document.getElementById(`edit-access-user-container-${classId}`).classList.toggle('hidden', val !== 'specific');
  };

  window.toggleTableEdit = async (classId) => {
    const container = document.getElementById(`table-editor-${classId}`);
    container.classList.toggle('hidden');
    if(!container.classList.contains('hidden')) {
      await renderEditUsersList(classId);
      renderTableRows(classId);
    }
  };

  async function renderEditUsersList(classId) {
    const classObj = classesData.find(c => c.id === classId);
    const allowed = classObj.allowedUsers || [];

    if(allUsersList.length === 0) {
      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });
    }

    const container = document.getElementById(`edit-users-list-${classId}`);
    container.innerHTML = allUsersList.map(u => {
      const isChecked = allowed.includes(u.uid);
      return `
        <label class="user-select-item">
          <input type="checkbox" value="${u.uid}" class="edit-user-cb-${classId}" ${isChecked ? 'checked' : ''}> ${u.name}
        </label>
      `;
    }).join('');
  }

  function renderTableRows(classId) {
    const classObj = classesData.find(c => c.id === classId);
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const sessions = classObj.sessions || {};
    const dates = Object.keys(sessions).sort();

    tbody.innerHTML = dates.map(d => `
      <tr data-date="${d}">
        <td><input type="date" value="${d}" class="edit-date-input"></td>
        <td><input type="text" value="${sessions[d].time}" class="edit-time-input"></td>
        <td><input type="text" value="${sessions[d].location}" class="edit-loc-input"></td>
        <td><button onclick="this.closest('tr').remove()" style="padding:2px 6px; margin:0; background:#ef4444; font-size:10px;">刪除</button></td>
      </tr>
    `).join('');
  }

  window.addTableRow = (classId) => {
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const todayStr = new Date().toISOString().split('T')[0];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="date" value="${todayStr}" class="edit-date-input"></td>
      <td><input type="text" value="19:00" class="edit-time-input"></td>
      <td><input type="text" value="Studio A" class="edit-loc-input"></td>
      <td><button onclick="this.closest('tr').remove()" style="padding:2px 6px; margin:0; background:#ef4444; font-size:10px;">刪除</button></td>
    `;
    tbody.appendChild(tr);
  };

  window.saveTableChanges = async (classId) => {
    const classObj = classesData.find(c => c.id === classId);
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const rows = tbody.querySelectorAll('tr');

    const accessType = document.getElementById(`edit-access-type-${classId}`).value;
    let allowedUsers = [];

    if(accessType === 'specific') {
      const cbs = document.querySelectorAll(`.edit-user-cb-${classId}:checked`);
      allowedUsers = Array.from(cbs).map(cb => cb.value);
      if(!allowedUsers.includes(classObj.leaderId)) allowedUsers.push(classObj.leaderId);
    }

    const newSessions = {};
    rows.forEach(tr => {
      const dateVal = tr.querySelector('.edit-date-input').value;
      const timeVal = tr.querySelector('.edit-time-input').value;
      const locVal = tr.querySelector('.edit-loc-input').value;

      if(dateVal) {
        const oldStudents = (classObj.sessions && classObj.sessions[dateVal]) ? classObj.sessions[dateVal].students : [];
        newSessions[dateVal] = {
          time: timeVal,
          location: locVal,
          students: oldStudents
        };
      }
    });

    try {
      await updateDoc(doc(db, "classes", classId), {
        accessType,
        allowedUsers,
        sessions: newSessions
      });
      alert("【成功】課程權限與堂數變更已儲存寫入資料庫！");
      loadClasses();
    } catch(e) {
      alert("儲存失敗: " + e.message);
    }
  };

  window.toggleSessionJoin = async (classId, dateStr, isJoining) => {
    const classObj = classesData.find(c => c.id === classId);
    if(!classObj) return;

    const sessions = classObj.sessions;
    let students = sessions[dateStr].students || [];

    if(isJoining) {
      if(!students.some(s => s.uid === currentUser.uid)) {
        students.push({ uid: currentUser.uid, name: currentUserProfile.name || '學員' });
      }
    } else {
      students = students.filter(s => s.uid !== currentUser.uid);
    }

    sessions[dateStr].students = students;

    try {
      await updateDoc(doc(db, "classes", classId), { sessions: sessions });
      loadClasses();
    } catch(e) {
      alert("操作失敗: " + e.message);
    }
  };

  window.deleteClass = async (id) => {
    if(confirm("確定要刪除/解散此課程嗎？")) {
      try {
        await deleteDoc(doc(db, "classes", id));
        alert("課程已成功從資料庫刪除！");
        loadClasses();
      } catch(e) {
        alert("刪除失敗: " + e.message);
      }
    }
  }
</script>

</body>
</html>
