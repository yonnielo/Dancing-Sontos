      let miscTableRowsHtml = miscExpenses.map((item, idx) => {
        const partCount = (item.participants || []).length;
        const sharePerPerson = partCount > 0 ? (Number(item.amount) || 0) / partCount : 0;
        const roundedShare = Math.round(sharePerPerson * 100) / 100;
        const isMiscLocked = settledMiscIndices.includes(idx) || item.isLocked;

        return `
          <tr>
            <td style="padding:4px; border:1px solid var(--pojai-border); font-size:11px;">${item.name}</td>
            <td style="padding:4px; border:1px solid var(--pojai-border); font-size:11px;">$${item.amount}</td>
            <td style="padding:4px; border:1px solid var(--pojai-border); font-size:11px;">${item.payer}</td>
            <td style="padding:4px; border:1px solid var(--pojai-border); font-size:11px;">${(item.participants || []).join(', ') || '無'}</td>
            <td style="padding:4px; border:1px solid var(--pojai-border); font-size:11px;">
              <div class="flex between" style="align-items:center;">
                <span>$${roundedShare}</span>
                ${(!isMiscLocked) ? `<button onclick="deleteMiscItem('${c.id}', ${idx})" style="width:auto; margin:0; padding:1px 4px; font-size:12px; background:transparent; color:#be123c; border:none; box-shadow:none;">❌</button>` : ''}
              </div>
            </td>
            <td style="padding:4px; border:1px solid var(--pojai-border); text-align:center; font-size:11px;">
              <input type="checkbox" value="${idx}" class="pojai-misc-cb-${c.id}" ${isMiscLocked ? 'checked disabled' : 'checked'} style="margin:0; width:auto; cursor:pointer;" ${isMiscLocked ? 'title="已埋數鎖定"' : ''}>
            </td>
          </tr>
        `;
      }).join('');

      let miscTableHtml = `
        <div class="table-container" style="background:#fff; margin-top:4px; margin-bottom:6px;">
          <table style="width:100%; border-collapse:collapse; font-size:11px;">
            <thead>
              <tr style="background:#fef08a; color:var(--pojai-text);">
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:left;">項目</th>
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:left;">總額</th>
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:left;">付款人</th>
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:left;">邊個有份</th>
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:left;">每人幾錢</th>
                <th style="padding:4px; border:1px solid var(--pojai-border); text-align:center; width:45px;">埋數</th>
              </tr>
            </thead>
            <tbody>
              ${miscTableRowsHtml || `<tr><td colspan="6" style="padding:6px; text-align:center; color:#6b7280; border:1px solid var(--pojai-border);">暫無雜費記錄</td></tr>`}
            </tbody>
          </table>
        </div>
      `;

      const participantsCheckboxes = eligibleNames.map(name => `
        <label style="font-size:11px; display:inline-flex; align-items:center; gap:2px; margin-right:6px; cursor:pointer;">
          <input type="checkbox" value="${name}" class="misc-part-cb-${c.id}" checked style="margin:0; width:auto;"> ${name}
        </label>
      `).join('');

      let addMiscFormHtml = `
        <div style="margin-top: 6px; padding: 6px; background: #fff; border: 1px dashed var(--pojai-border); border-radius: 4px;">
          <div style="font-size:11px; font-weight:bold; color:var(--pojai-text); margin-bottom:4px;">➕ 新增雜費項目</div>
          <input type="text" id="misc-name-${c.id}" placeholder="項目名稱 (例如:買水 / 道具)" style="margin:2px 0 4px 0; font-size:11px; padding:4px;">
          <div class="flex" style="gap:4px; margin-bottom:4px;">
            <input type="number" id="misc-amount-${c.id}" placeholder="總金額 ($)" style="margin:0; font-size:11px; padding:4px;" title="請輸入該項目的總金額">
            <select id="misc-payer-${c.id}" style="margin:0; font-size:11px; padding:4px;">
              ${payerOptions}
            </select>
          </div>
          <div style="font-size:11px; color:var(--pojai-text); margin-bottom:4px;">邊個有份：</div>
          <div style="max-height:80px; overflow-y:auto; background:#f9fafb; padding:4px; border:1px solid #e5e7eb; border-radius:4px; margin-bottom:4px;">
            ${participantsCheckboxes}
          </div>
          <button onclick="addMiscItem('${c.id}')" class="btn-pojai" style="padding:3px 8px; font-size:11px;">新增雜費</button>
        </div>
      `;

      const currentTab = activeTabState[c.id] || 'course';

      let settlementActionBtnsHtml = `
        <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 8px;">
          <button onclick="runCalculate('${c.id}', false)" class="btn-pojai" style="padding: 6px 16px; font-size: 13px;">👀 睇數</button>
          <button onclick="runCalculate('${c.id}', true)" class="btn-pojai" style="padding: 6px 16px; font-size: 13px;">🧮 埋數</button>
        </div>
      `;

      let settlementHistoryHtml = '';
      if (c.settlementHistory && c.settlementHistory.length > 0) {
        settlementHistoryHtml = c.settlementHistory.map((hist, hIdx) => `
          <div style="background: #fff; padding: 8px; border-radius: 6px; border: 1px solid var(--pojai-border); margin-top: 8px; font-size: 12px; color: var(--pojai-text);">
            <b>📅 埋數記錄 #${hIdx + 1} (${hist.timestamp})：</b><br>${hist.resultText}
          </div>
        `).join('');
      }

      return `
        <div class="course-card">
          
          <div class="course-card-header" style="border-left: 4px solid ${headerBorderColor};">
            <div style="width: 100%;">
              <div class="flex between" style="align-items: center; width: 100%;">
                <div>
                  <strong style="font-size: 17px; ${classNameStyle}">${c.name}</strong>${completedBadgeHtml}
                </div>
                <button onclick="toggleFavorite('${c.id}')" style="background: transparent; border: none; font-size: 18px; cursor: pointer; width: auto; margin: 0; padding: 0; box-shadow: none;" title="心水課程釘選">${isFav ? '❤️' : '🩶'}</button>
              </div>
              <div style="margin-top: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
                <span class="badge-leader">👑 班長: ${c.leaderName}</span>
                ${classTypeBadge}
              </div>
              <div>
                ${leaderNoteHtml}
              </div>
            </div>
            <button onclick="toggleCourseBody('${c.id}')" id="collapse-btn-${c.id}" class="collapse-toggle-btn" title="展開/收藏課程資料">
              <div class="collapse-arrow"></div>
            </button>
          </div>

          <div id="course-body-${c.id}" class="hidden">

            <div class="tab-header">
              <button onclick="switchTab('${c.id}', 'course')" id="tab-btn-course-${c.id}" class="tab-btn ${currentTab === 'course' ? 'active-tab-course' : ''}">📚 課程</button>
              <button onclick="switchTab('${c.id}', 'pojai')" id="tab-btn-pojai-${c.id}" class="tab-btn ${currentTab === 'pojai' ? 'active-tab-pojai' : ''}">👵🏼 婆仔數</button>
              ${canManage ? `<button onclick="switchTab('${c.id}', 'admin')" id="tab-btn-admin-${c.id}" class="tab-btn ${currentTab === 'admin' ? 'active-tab-admin' : ''}">🛠️ 班長管理</button>` : ''}
            </div>

            <div id="tab-content-course-${c.id}" class="tab-content ${currentTab === 'course' ? 'active-content' : ''}">
              <div class="course-tab-content-box">
                <div style="margin-top: 0;">
                  ${sessionsHtml || '<p style="font-size:12px; color:#6b7280;">暫無上堂日期</p>'}
                </div>
              </div>
            </div>

            <div id="tab-content-pojai-${c.id}" class="tab-content ${currentTab === 'pojai' ? 'active-content' : ''}">
              <div class="pojai-box" style="margin-top:0;">
                ${pojaiSummaryHtml}
                
                <hr style="border: none; border-top: 1px solid var(--pojai-border); margin: 8px 0;">
                ${pojaiSessionsSectionHtml}

                <div style="font-weight:bold; color:var(--pojai-text); font-size:12px; margin-bottom:4px;">🪬雜費</div>
                ${miscTableHtml}
                ${addMiscFormHtml}

                <hr style="border: none; border-top: 1px solid var(--pojai-border); margin: 10px 0;">
                ${settlementActionBtnsHtml}
                
                <!-- 獨立分開的睇數框 -->
                <div id="preview-result-${c.id}" class="hidden" style="background: #fff; padding: 8px; border-radius: 6px; border: 1px solid var(--pojai-border); margin-top: 8px; font-size: 12px; color: var(--pojai-text);"></div>

                <!-- 獨立分開的埋數框與歷史記錄容器 -->
                <div id="settlement-history-container-${c.id}" style="margin-top: 8px;">
                  ${settlementHistoryHtml}
                </div>
              </div>
            </div>

            ${canManage ? `
              <div id="tab-content-admin-${c.id}" class="tab-content ${currentTab === 'admin' ? 'active-content' : ''}">
                <div class="admin-edit-box" style="margin-top:0;">
                  <div style="background:#fff; padding:8px; border-radius:8px; border:1px solid #bae6fd; margin-bottom:8px;">
                    <label style="font-size:11px; font-weight:bold; color:#0369a1;">📝 修改課程名稱：</label>
                    <input type="text" id="edit-class-name-${c.id}" value="${c.name}" style="margin-top:4px; font-size:12px;">
                  </div>

                  <div style="background:#fff; padding:8px; border-radius:8px; border:1px solid #bae6fd; margin-bottom:8px;">
                    <label style="font-size:11px; font-weight:bold; color:#0369a1;">💬 修改「班長的話」：</label>
                    <textarea id="edit-leader-note-${c.id}" rows="2" style="margin-top:4px; font-size:12px;">${c.leaderNote || ''}</textarea>
                  </div>

                  <div style="background:#fff; padding:8px; border-radius:8px; border:1px solid #bae6fd; margin-bottom:8px;">
                    <label style="font-size:11px; font-weight:bold; color:#0369a1;">🔒 修改「誰能報讀/查看」此課程：</label>
                    <select id="edit-access-type-${c.id}" onchange="toggleEditAccessUserList('${c.id}')" style="margin-top:4px;">
                      <option value="all" ${c.accessType !== 'specific' ? 'selected' : ''}>全部人 (公開班)</option>
                      <option value="specific" ${c.accessType === 'specific' ? 'selected' : ''}>指定成員 (私人小組班)</option>
                    </select>

                    <div id="edit-access-user-container-${c.id}" class="${c.accessType === 'specific' ? '' : 'hidden'}" style="margin-top:6px;">
                      <small style="color:#6b7280;">勾選可查看與報名的成員：</small>
                      <div class="custom-dropdown-container" id="edit-dropdown-container-${c.id}" style="margin-top:4px;">
                        <button type="button" class="custom-dropdown-toggle" id="edit-dropdown-toggle-${c.id}" onclick="event.stopPropagation(); toggleEditDropdownMenu('${c.id}')">
                          <span id="edit-dropdown-label-${c.id}">選擇成員...</span>
                          <span>▼</span>
                        </button>
                        <div class="custom-dropdown-menu" id="edit-dropdown-menu-${c.id}">
                          <input type="text" class="custom-dropdown-search" id="edit-dropdown-search-${c.id}" placeholder="搜尋用戶..." oninput="filterEditDropdown('${c.id}')" onclick="event.stopPropagation()">
                          <div class="custom-dropdown-list" id="edit-users-list-${c.id}">
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div class="flex between" style="align-items:center;">
                    <label style="font-size:11px; font-weight:bold; color:#0369a1;">📅 編輯堂數、封盤狀態、時間, 地點與付款人：</label>
                    <span style="font-size:10px; color:#0284c7; font-weight:bold;">💡 橫向滑動查看 ➔</span>
                  </div>

                  <div class="table-container">
                    <table class="edit-table">
                      <thead>
                        <tr>
                          <th style="width:110px;">日期</th>
                          <th style="width:80px;">封盤</th>
                          <th style="width:65px;">開始時間</th>
                          <th style="width:65px;">完結時間</th>
                          <th style="width:90px;">地點</th>
                          <th style="width:60px;">學費($)</th>
                          <th style="width:90px;">學費付款人</th>
                          <th style="width:60px;">場租($)</th>
                          <th style="width:90px;">場租付款人</th>
                          <th style="min-width:160px;">已報名學員 (點擊刪除)</th>
                          <th style="width:50px;">操作</th>
                        </tr>
                      </thead>
                      <tbody id="table-tbody-${c.id}">
                      </tbody>
                    </table>
                  </div>

                  <div class="flex" style="margin-top: 8px; gap:4px;">
                    <button onclick="addTableRow('${c.id}')" class="btn-blue-action" style="width:auto; margin:0; padding:6px 10px; font-size:11px;">➕ 加開一堂</button>
                    <button onclick="saveTableChanges('${c.id}')" class="btn-blue-action" style="width:auto; margin:0; padding:6px 10px; font-size:11px;">💾 儲存變更</button>
                    <button onclick="deleteClass('${c.id}')" class="btn-danger" style="width:auto; margin:0; margin-left:auto; padding:6px 10px; font-size:11px;">刪除全課</button>
                  </div>
                </div>
              </div>
            ` : ''}

          </div>

        </div>
      `;
    }).join('');

    expandedIds.forEach(classId => {
      const bodyEl = document.getElementById(`course-body-${classId}`);
      const btnEl = document.getElementById(`collapse-btn-${classId}`);
      if (bodyEl) bodyEl.classList.remove('hidden');
      if (btnEl) btnEl.classList.add('expanded');
      
      if (activeTabState[classId] === 'admin') {
        renderEditUsersList(classId);
        renderTableRows(classId);
      }
    });
  }

  window.toggleLeaderNote = (classId) => {
    const box = document.getElementById(`leader-note-box-${classId}`);
    if (box) {
      box.classList.toggle('hidden');
    }
  };

  window.switchTab = async (classId, tabName) => {
    activeTabState[classId] = tabName;

    const courseBtn = document.getElementById(`tab-btn-course-${classId}`);
    const pojaiBtn = document.getElementById(`tab-btn-pojai-${classId}`);
    const adminBtn = document.getElementById(`tab-btn-admin-${classId}`);
    
    const courseContent = document.getElementById(`tab-content-course-${classId}`);
    const pojaiContent = document.getElementById(`tab-content-pojai-${classId}`);
    const adminContent = document.getElementById(`tab-content-admin-${classId}`);

    if (tabName === 'course') {
      courseBtn.className = "tab-btn active-tab-course";
      pojaiBtn.className = "tab-btn";
      if (adminBtn) adminBtn.className = "tab-btn";

      courseContent.className = "tab-content active-content";
      pojaiContent.className = "tab-content";
      if (adminContent) adminContent.className = "tab-content";
    } else if (tabName === 'pojai') {
      courseBtn.className = "tab-btn";
      pojaiBtn.className = "tab-btn active-tab-pojai";
      if (adminBtn) adminBtn.className = "tab-btn";

      courseContent.className = "tab-content";
      pojaiContent.className = "tab-content active-content";
      if (adminContent) adminContent.className = "tab-content";
    } else if (tabName === 'admin') {
      courseBtn.className = "tab-btn";
      pojaiBtn.className = "tab-btn";
      if (adminBtn) adminBtn.className = "tab-btn";

      courseContent.className = "tab-content";
      pojaiContent.className = "tab-content";
      if (adminContent) adminContent.className = "tab-content active-content";

      const querySnapshot = await getDocs(collection(db, "users"));
      allUsersList = [];
      querySnapshot.forEach(docSnap => {
        allUsersList.push({ uid: docSnap.id, ...docSnap.data() });
      });
      await renderEditUsersList(classId);
      renderTableRows(classId);
    }
  };

  window.toggleCourseBody = (classId) => {
    const bodyEl = document.getElementById(`course-body-${classId}`);
    const btnEl = document.getElementById(`collapse-btn-${classId}`);
    bodyEl.classList.toggle('hidden');
    btnEl.classList.toggle('expanded');
  };

  window.toggleEditAccessUserList = (classId) => {
    const val = document.getElementById(`edit-access-type-${classId}`).value;
    document.getElementById(`edit-access-user-container-${classId}`).classList.toggle('hidden', val !== 'specific');
  };

  window.toggleEditDropdownMenu = (classId) => {
    const menu = document.getElementById(`edit-dropdown-menu-${classId}`);
    if (menu) {
      document.querySelectorAll('.custom-dropdown-menu.show').forEach(m => {
        if (m !== menu) m.classList.remove('show');
      });
      menu.classList.toggle('show');
      if (menu.classList.contains('show')) {
        const searchInput = document.getElementById(`edit-dropdown-search-${classId}`);
        if (searchInput) searchInput.focus();
      }
    }
  };

  window.filterEditDropdown = (classId) => {
    const searchInput = document.getElementById(`edit-dropdown-search-${classId}`);
    const keyword = searchInput.value.toLowerCase();
    const items = document.querySelectorAll(`#edit-users-list-${classId} .custom-dropdown-option`);
    items.forEach(item => {
      const text = item.getAttribute('data-name').toLowerCase();
      if (text.includes(keyword)) {
        item.style.display = 'flex';
      } else {
        item.style.display = 'none';
      }
    });
  };

  window.updateEditDropdownLabel = (classId) => {
    const checkboxes = document.querySelectorAll(`.edit-user-cb-${classId}:checked`);
    const label = document.getElementById(`edit-dropdown-label-${classId}`);
    if (!label) return;
    if (checkboxes.length === 0) {
      label.innerText = "選擇成員...";
    } else {
      const names = [];
      checkboxes.forEach(cb => {
        const opt = cb.closest('.custom-dropdown-option');
        if (opt) {
          const span = opt.querySelector('span');
          if (span) names.push(span.innerText);
        }
      });
      label.innerText = names.join(', ');
    }
  };

  async function renderEditUsersList(classId) {
    const classObj = classesData.find(c => c.id === classId);
    const allowed = classObj.allowedUsers || [];

    const container = document.getElementById(`edit-users-list-${classId}`);
    if (!container) return;
    container.innerHTML = allUsersList.map(u => {
      const isChecked = allowed.includes(u.uid);
      const userName = u.name || u.email || '未命名用戶';
      return `
        <div class="custom-dropdown-option" data-name="${userName}" onclick="event.stopPropagation()">
          <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-right:8px;">${userName}</span>
          <input type="checkbox" value="${u.uid}" class="edit-user-cb-${classId}" ${isChecked ? 'checked' : ''} onchange="updateEditDropdownLabel('${classId}')">
        </div>
      `;
    }).join('');
    updateEditDropdownLabel(classId);
  }

  function renderTableRows(classId) {
    const classObj = classesData.find(c => c.id === classId);
    const tbody = document.getElementById(`table-tbody-${classId}`);
    if (!tbody) return;
    const sessions = classObj.sessions || {};
    const dates = Object.keys(sessions).sort();

    tbody.innerHTML = dates.map(d => {
      const sess = sessions[d];
      const students = sess.students || [];

      const studentChipsHtml = students.map(s => `
        <span class="student-chip" data-uid="${s.uid}" data-name="${s.name}">
          ${s.name}
          <button type="button" onclick="removeStudentFromSessionRow(this)">✕</button>
        </span>
      `).join('');

      const sessionUsersMap = new Map();
      sessionUsersMap.set(classObj.leaderId, classObj.leaderName);
      students.forEach(s => sessionUsersMap.set(s.uid, s.name));

      const sessionUsersList = Array.from(sessionUsersMap.entries()).map(([uid, name]) => ({ uid, name }));

      const feePayerOptions = sessionUsersList.map(u => {
        const isSelected = u.uid === (sess.feePayerUid || classObj.leaderId);
        return `<option value="${u.uid}" ${isSelected ? 'selected' : ''}>${u.name}</option>`;
      }).join('');

      const rentPayerOptions = sessionUsersList.map(u => {
        const isSelected = u.uid === (sess.rentPayerUid || sess.payerUid || classObj.leaderId);
        return `<option value="${u.uid}" ${isSelected ? 'selected' : ''}>${u.name}</option>`;
      }).join('');

      const feeVal = sess.fee !== undefined ? sess.fee : classObj.price;
      const startTimeVal = sess.startTime || sess.time || '19:00';
      const endTimeVal = sess.endTime || '21:00';
      const isClosed = sess.isClosed || false;

      return `
        <tr data-date="${d}" class="edit-session-row">
          <td><input type="date" value="${d}" class="edit-date-input"></td>
          <td>
            <select class="edit-closed-select" style="font-weight:bold; color: ${isClosed ? '#be123c' : '#6b7280'};">
              <option value="false" ${!isClosed ? 'selected' : ''}>OFF</option>
              <option value="true" ${isClosed ? 'selected' : ''}>ON (封盤)</option>
            </select>
          </td>
          <td><input type="time" value="${startTimeVal}" class="edit-start-time-input"></td>
          <td><input type="time" value="${endTimeVal}" class="edit-end-time-input"></td>
          <td><input type="text" value="${sess.location || ''}" class="edit-loc-input"></td>
          <td><input type="number" value="${feeVal}" class="edit-fee-input"></td>
          <td>
            <select class="edit-fee-payer-select">
              ${feePayerOptions}
            </select>
          </td>
          <td><input type="number" value="${sess.rent || 0}" class="edit-rent-input"></td>
          <td>
            <select class="edit-rent-payer-select">
              ${rentPayerOptions}
            </select>
          </td>
          <td>
            <div class="students-container" style="display:flex; flex-wrap:wrap; gap:3px;">${studentChipsHtml || '<span style="color:#6b7280; font-size:11px;">暫無</span>'}</div>
          </td>
          <td><button onclick="this.closest('tr').remove()" style="padding:3px 6px; margin:0; background:#fb7185; font-size:11px; white-space:nowrap;">❌ 刪除</button></td>
        </tr>
      `;
    }).join('');
  }

  window.removeStudentFromSessionRow = (btn) => {
    btn.closest('.student-chip').remove();
  };

  window.addTableRow = (classId) => {
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const todayStr = new Date().toISOString().split('T')[0];
    const classObj = classesData.find(c => c.id === classId);

    const payerOptions = `<option value="${classObj.leaderId}" selected>${classObj.leaderName}</option>`;

    const tr = document.createElement('tr');
    tr.className = 'edit-session-row';
    tr.innerHTML = `
      <td><input type="date" value="${todayStr}" class="edit-date-input"></td>
      <td>
        <select class="edit-closed-select" style="font-weight:bold; color: #6b7280;">
          <option value="false" selected>OFF</option>
          <option value="true">ON (封盤)</option>
        </select>
      </td>
      <td><input type="time" value="19:00" class="edit-start-time-input"></td>
      <td><input type="time" value="21:00" class="edit-end-time-input"></td>
      <td><input type="text" value="Studio A" class="edit-loc-input"></td>
      <td><input type="number" value="${classObj.price || 0}" class="edit-fee-input"></td>
      <td>
        <select class="edit-fee-payer-select">
          ${payerOptions}
        </select>
      </td>
      <td><input type="number" value="0" class="edit-rent-input"></td>
      <td>
        <select class="edit-rent-payer-select">
          ${payerOptions}
        </select>
      </td>
      <td>
        <div class="students-container" style="display:flex; flex-wrap:wrap; gap:3px;"><span style="color:#6b7280; font-size:11px;">暫無</span></div>
      </td>
      <td><button onclick="this.closest('tr').remove()" style="padding:3px 6px; margin:0; background:#fb7185; font-size:11px; white-space:nowrap;">❌ 刪除</button></td>
    `;
    tbody.appendChild(tr);
  };

  window.saveTableChanges = async (classId) => {
    const classObj = classesData.find(c => c.id === classId);
    const tbody = document.getElementById(`table-tbody-${classId}`);
    const rows = tbody.querySelectorAll('.edit-session-row');

    const newClassName = document.getElementById(`edit-class-name-${classId}`).value.trim();
    let charWidth = 0;
    for (const char of newClassName) {
      if (/[\u4e00-\u9fa5]/.test(char)) {
        charWidth += 2;
      } else {
        charWidth += 1;
      }
    }
    if (charWidth > 30) {
      return alert("課程名稱限制在15個中文字或30個英文字的寬度內");
    }

    const newLeaderNote = document.getElementById(`edit-leader-note-${classId}`).value.trim();
    
    if(!newClassName) return alert("課程名稱不能為空！");

    const accessType = document.getElementById(`edit-access-type-${classId}`).value;
    let allowedUsers = [];

    if(accessType === 'specific') {
      const cbs = document.querySelectorAll(`.edit-user-cb-${classId}:checked`);
      allowedUsers = Array.from(cbs).map(cb => cb.value);
      if(!allowedUsers.includes(classObj.leaderId)) allowedUsers.push(classObj.leaderId);
    }

    const newSessions = {};
    rows.forEach(tr => {
      const dateVal = tr.querySelector('.edit-date-input').value;
      const isClosed = tr.querySelector('.edit-closed-select').value === 'true';
      const startTimeVal = tr.querySelector('.edit-start-time-input').value;
      const endTimeVal = tr.querySelector('.edit-end-time-input').value;
      const locVal = tr.querySelector('.edit-loc-input').value;

      const feeVal = Number(tr.querySelector('.edit-fee-input').value) || 0;
      const feePayerUid = tr.querySelector('.edit-fee-payer-select').value;
      const feePayerObj = allUsersList.find(u => u.uid === feePayerUid);
      const feePayerName = feePayerObj ? (feePayerObj.name || feePayerObj.email) : (feePayerUid === classObj.leaderId ? classObj.leaderName : '班長');

      const rentVal = Number(tr.querySelector('.edit-rent-input').value) || 0;
      const rentPayerUid = tr.querySelector('.edit-rent-payer-select').value;
      const rentPayerObj = allUsersList.find(u => u.uid === rentPayerUid);
      const rentPayerName = rentPayerObj ? (rentPayerObj.name || rentPayerObj.email) : (rentPayerUid === classObj.leaderId ? classObj.leaderName : '班長');

      const studentChips = tr.querySelectorAll('.student-chip');
      const updatedStudents = [];
      studentChips.forEach(chip => {
        const uid = chip.getAttribute('data-uid');
        const nameText = chip.getAttribute('data-name') || chip.innerText.replace('✕', '').trim();
        if (uid) {
          updatedStudents.push({ uid, name: nameText });
        }
      });

      if(dateVal) {
        newSessions[dateVal] = {
          startTime: startTimeVal,
          endTime: endTimeVal,
          location: locVal,
          fee: feeVal,
          feePayerUid,
          feePayerName,
          rent: rentVal,
          rentPayerUid,
          rentPayerName,
          isClosed,
          students: updatedStudents
        };
      }
    });

    try {
      await updateDoc(doc(db, "classes", classId), {
        name: newClassName,
        leaderNote: newLeaderNote,
        accessType,
        allowedUsers,
        sessions: newSessions
      });
      alert("【成功】課程資訊與堂數封盤狀態已順利更新！");
      loadClasses();
    } catch(e) {
      alert("儲存失敗: " + e.message);
    }
  };

  window.addMiscItem = async (classId) => {
    const classObj = classesData.find(c => c.id === classId);
    if (!classObj) return;

    activeTabState[classId] = 'pojai';
    const nameInput = document.getElementById(`misc-name-${classId}`);
    const amountInput = document.getElementById(`misc-amount-${classId}`);
    const payerSelect = document.getElementById(`misc-payer-${classId}`);
    const partCbs = document.querySelectorAll(`.misc-part-cb-${classId}:checked`);

    const name = nameInput.value.trim();
    const amount = Number(amountInput.value) || 0;
    const payer = payerSelect.value;
    const participants = Array.from(partCbs).map(cb => cb.value);

    if (!name) return alert("請輸入項目名稱");
    if (amount <= 0) return alert("請輸入有效的總金額");
    if (participants.length === 0) return alert("請至少選擇一個有份的成員");

    const miscExpenses = classObj.miscExpenses || [];
    miscExpenses.push({ name, amount, payer, participants, isLocked: false });

    try {
      await updateDoc(doc(db, "classes", classId), { miscExpenses });
      loadClasses();
    } catch(e) {
      alert("新增雜費失敗: " + e.message);
    }
  };

  window.deleteMiscItem = async (classId, index) => {
    activeTabState[classId] = 'pojai';
    const classObj = classesData.find(c => c.id === classId);
    if (!classObj) return;

    if (!confirm("確定要刪除此雜費項目嗎？")) return;

    const miscExpenses = classObj.miscExpenses || [];
    miscExpenses.splice(index, 1);

    try {
      await updateDoc(doc(db, "classes", classId), { miscExpenses });
      loadClasses();
    } catch(e) {
      alert("刪除雜費失敗: " + e.message);
    }
  };

  window.runCalculate = async (classId, isSettleAction) => {
    const classObj = classesData.find(c => c.id === classId);
    if (!classObj) return;

    activeTabState[classId] = 'pojai';

    const selectedSessionCbs = document.querySelectorAll(`.pojai-session-cb-${classId}:checked:not(:disabled)`);
    const targetSessions = Array.from(selectedSessionCbs).map(cb => cb.value);

    const selectedMiscCbs = document.querySelectorAll(`.pojai-misc-cb-${classId}:checked:not(:disabled)`);
    const targetMiscIndices = Array.from(selectedMiscCbs).map(cb => Number(cb.value));

    if (targetSessions.length === 0 && targetMiscIndices.length === 0) {
      alert("請至少選擇一堂課堂或一項雜費進行計算！");
      return;
    }

    const sessions = classObj.sessions || {};
    const memberMap = {};

    targetSessions.forEach(dateStr => {
      const sess = sessions[dateStr];
      if (!sess) return;
      const students = sess.students || [];
      const feeVal = Number(sess.fee !== undefined ? sess.fee : classObj.price) || 0;
      const rentVal = Number(sess.rent || 0);
      const enrolledCount = students.length;

      const feePayerName = sess.feePayerName || classObj.leaderName;
      const rentPayerName = sess.rentPayerName || classObj.leaderName;

      if (!memberMap[feePayerName]) memberMap[feePayerName] = { tuition: 0, rent: 0, paid: 0, miscShare: 0 };
      if (!memberMap[rentPayerName]) memberMap[rentPayerName] = { tuition: 0, rent: 0, paid: 0, miscShare: 0 };

      memberMap[feePayerName].paid += feeVal * enrolledCount;
      memberMap[rentPayerName].paid += rentVal;

      students.forEach(s => {
        if (!memberMap[s.name]) memberMap[s.name] = { tuition: 0, rent: 0, paid: 0, miscShare: 0 };
        memberMap[s.name].tuition += feeVal;
        if (enrolledCount > 0) {
          memberMap[s.name].rent += (rentVal / enrolledCount);
        }
      });
    });

    const miscExpenses = classObj.miscExpenses || [];
    targetMiscIndices.forEach(idx => {
      const item = miscExpenses[idx];
      if (!item) return;
      const amount = Number(item.amount) || 0;
      const payer = item.payer || classObj.leaderName;
      const participants = item.participants || [];

      if (!memberMap[payer]) memberMap[payer] = { tuition: 0, rent: 0, paid: 0, miscShare: 0 };
      memberMap[payer].paid += amount;

      const partCount = participants.length;
      if (partCount > 0) {
        const sharePerPerson = amount / partCount;
        participants.forEach(pName => {
          if (!memberMap[pName]) memberMap[pName] = { tuition: 0, rent: 0, paid: 0, miscShare: 0 };
          memberMap[pName].miscShare += sharePerPerson;
        });
      }
    });

    let resultText = "";
    const memberBalances = {};

    Object.keys(memberMap).forEach(name => {
      const data = memberMap[name];
      const roundedRent = Math.round(data.rent * 100) / 100;
      const roundedMisc = Math.round(data.miscShare * 100) / 100;
      const totalCost = data.tuition + roundedRent + roundedMisc;
      const balance = Math.round((data.paid - totalCost) * 100) / 100;
      memberBalances[name] = balance;

      resultText += `👤 <b>${name}</b>：總消費 $${totalCost} (學費 $${data.tuition} + 場租 $${roundedRent} + 雜費 $${roundedMisc}) ｜ 墊付 $${data.paid} ｜ <b>${balance >= 0 ? `應收回 $${balance}` : `需支付 $${Math.abs(balance)}`}</b><br>`;
    });

    const debtors = [];
    const creditors = [];

    Object.entries(memberBalances).forEach(([name, bal]) => {
      if (bal < -0.01) debtors.push({ name, amount: Math.abs(bal) });
      else if (bal > 0.01) creditors.push({ name, amount: bal });
    });

    resultText += `<br><b>💡 建議轉帳找數方案：</b><br>`;
    let transferStepsCount = 0;

    while (debtors.length > 0 && creditors.length > 0) {
      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const d = debtors[0];
      const c = creditors[0];
      const transferAmount = Math.min(d.amount, c.amount);
      const roundedTransfer = Math.round(transferAmount * 100) / 100;

      if (roundedTransfer > 0) {
        resultText += `👉 <b>${d.name}</b> 轉帳 <b>$${roundedTransfer}</b> 給 <b>${c.name}</b><br>`;
        transferStepsCount++;
      }

      d.amount -= transferAmount;
      c.amount -= transferAmount;

      if (d.amount < 0.01) debtors.shift();
      if (c.amount < 0.01) creditors.shift();
    }

    if (transferStepsCount === 0) {
      resultText += `所有參與者帳目已平，無需轉帳！<br>`;
    }

    if (isSettleAction) {
      const confirmSettle = confirm("⚠️ 確定要執行「埋數」嗎？埋數後所選的課堂將會變為「封盤」狀態，且已埋數的雜費將會鎖定無法再刪除！");
      if (!confirmSettle) return;

      const settledSessions = classObj.settledSessions || [];
      targetSessions.forEach(d => {
        if (!settledSessions.includes(d)) settledSessions.push(d);
        if (sessions[d]) sessions[d].isClosed = true; // 1) 當班長確定埋數後，已埋數的課堂要變成「封盤」
      });

      const settledMiscIndices = classObj.settledMiscIndices || [];
      targetMiscIndices.forEach(idx => {
        if (!settledMiscIndices.includes(idx)) settledMiscIndices.push(idx);
        if (miscExpenses[idx]) miscExpenses[idx].isLocked = true;
      });

      const settlementHistory = classObj.settlementHistory || [];
      const timestamp = new Date().toLocaleString('zh-TW', { hour12: false });
      settlementHistory.unshift({ timestamp, resultText });

      try {
        await updateDoc(doc(db, "classes", classId), {
          sessions,
          miscExpenses,
          settledSessions,
          settledMiscIndices,
          settlementHistory
        });
        alert("【成功】已成功完成埋數，相關課堂已封盤！");
        loadClasses();
      } catch (e) {
        alert("埋數失敗: " + e.message);
      }
    } else {
      const previewEl = document.getElementById(`preview-result-${classId}`);
      if (previewEl) {
        previewEl.innerHTML = `<b>👀 睇數結果預覽：</b><br>${resultText}`;
        previewEl.classList.remove('hidden');
      }
    }
  };

  window.deleteClass = async (classId) => {
    if(!confirm("⚠️ 警告：確定要刪除整個課程嗎？此動作無法復原！")) return;
    try {
      await deleteDoc(doc(db, "classes", classId));
      alert("【成功】課程已成功刪除！");
      loadClasses();
    } catch(e) {
      alert("刪除課程失敗: " + e.message);
    }
  };
</script>
