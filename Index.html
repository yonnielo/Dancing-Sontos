<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>跳舞班結數助手</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 15px; margin: 0; }
    .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
    h2 { font-size: 18px; margin-top: 0; color: #333; }
    label { display: block; margin: 8px 0 4px; font-size: 14px; color: #666; }
    input, select, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
    button { background: #007aff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:active { background: #0056b3; }
    .result-item { background: #eef6ff; border-left: 4px solid #007aff; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 15px; }
    .tag { display: inline-block; background: #e0e0e0; padding: 3px 8px; border-radius: 12px; font-size: 12px; margin-right: 5px; }
  </style>
</head>
<body>

  <h2>🕺 跳舞班結數與最少交易器</h2>

  <div class="card">
    <h2>1. 輸入費用項目</h2>
    <label>項目名稱</label>
    <input type="text" id="itemTitle" placeholder="例如：觀塘 Studio 場租 / 表演衫">
    
    <label>總金額 ($)</label>
    <input type="number" id="itemAmount" placeholder="300">
    
    <label>先墊付的人 (Payer)</label>
    <input type="text" id="payer" placeholder="例如：Admin (Mandy)">
    
    <label>參與分攤成員 (用逗號分開)</label>
    <input type="text" id="members" placeholder="Mandy, Alex, Chris, Ben">

    <button onclick="addExpense()">加入費用</button>
  </div>

  <div class="card">
    <h2>2. 已輸入項目</h2>
    <div id="expenseList" style="font-size: 14px; color: #555;">暫無項目</div>
  </div>

  <div class="card">
    <h2>3. 最佳化清算結果</h2>
    <button onclick="calculateSettlement()" style="background: #34c759;">計算最少轉帳次數</button>
    <div id="settlementResult" style="margin-top: 10px;"></div>
  </div>

  <script>
    let expenses = [];

    function addExpense() {
      const title = document.getElementById('itemTitle').value.trim();
      const amount = parseFloat(document.getElementById('itemAmount').value);
      const payer = document.getElementById('payer').value.trim();
      const membersStr = document.getElementById('members').value.trim();

      if (!title || isNaN(amount) || !payer || !membersStr) {
        alert("請填寫所有欄位！");
        return;
      }

      const membersList = membersStr.split(',').map(m => m.trim()).filter(m => m !== '');

      expenses.push({ title, amount, payer, members: membersList });
      updateExpenseList();

      // 清空 input
      document.getElementById('itemTitle').value = '';
      document.getElementById('itemAmount').value = '';
    }

    function updateExpenseList() {
      const listDiv = document.getElementById('expenseList');
      if (expenses.length === 0) {
        listDiv.innerHTML = "暫無項目";
        return;
      }
      listDiv.innerHTML = expenses.map((e, idx) => `
        <div style="border-bottom: 1px solid #eee; padding: 6px 0;">
          <strong>${e.title}</strong> - $${e.amount}<br>
          <span style="font-size:12px; color:#888;">由 ${e.payer} 墊付 | 分攤: ${e.members.join(', ')}</span>
        </div>
      `).join('');
    }

    // 最少交易次數演算法
    function calculateSettlement() {
      let balances = {};

      // 算每人淨資產 (Net Balance)
      expenses.forEach(exp => {
        const splitAmount = exp.amount / exp.members.length;
        
        // 付款人增加應收金額
        balances[exp.payer] = (balances[exp.payer] || 0) + exp.amount;

        // 參與者扣除應付金額
        exp.members.forEach(m => {
          balances[m] = (balances[m] || 0) - splitAmount;
        });
      });

      // 將成員分為 欠錢者 (Debtors) 與 應收錢者 (Creditors)
      let debtors = [];
      let creditors = [];

      for (let person in balances) {
        let amount = Math.round(balances[person] * 100) / 100; // 捨入至小數點後兩位
        if (amount < -0.01) debtors.push({ person, amount: -amount });
        else if (amount > 0.01) creditors.push({ person, amount });
      }

      // 雙指標比對，生成最少次數交易
      let transactions = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        let debt = debtors[i].amount;
        let credit = creditors[j].amount;
        let minAmount = Math.min(debt, credit);

        transactions.push(`${debtors[i].person} 轉賬 <strong>$${minAmount.toFixed(1)}</strong> 給 ${creditors[j].person}`);

        debtors[i].amount -= minAmount;
        creditors[j].amount -= minAmount;

        if (debtors[i].amount < 0.01) i++;
        if (creditors[j].amount < 0.01) j++;
      }

      const resDiv = document.getElementById('settlementResult');
      if (transactions.length === 0) {
        resDiv.innerHTML = "<div class='result-item'>已全部清算，無需轉賬！</div>";
      } else {
        resDiv.innerHTML = transactions.map(t => `<div class='result-item'>👉 ${t}</div>`).join('');
      }
    }
  </script>
</body>
</html>
